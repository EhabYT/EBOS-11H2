  - !file: {path: "%systemroot%\\System32\\SecurityHealthUdk.dll", option: "disable-defender"}
  # A Defender antimalware platform update relocates the driver set from
  # System32\drivers\ into System32\drivers\wd\ and rewrites each service
  # ImagePath to match. Deleting only the old path removes the stale inbox copy
  # and leaves the live driver untouched, so both are listed. WdBoot is
  # deliberately absent - it is the ELAM driver the CoD attestation fix keeps.
  - !file: {path: "%systemroot%\\System32\\drivers\\WdNisDrv.sys", option: "disable-defender"}
  - !file: {path: "%systemroot%\\System32\\drivers\\wd\\WdNisDrv.sys", option: "disable-defender"}
  # Security Health moved the same way, into a versioned
  # System32\SecurityHealth\<version>-0\ folder, so the four System32 entries
  # above are no-ops on a machine that has taken that update. Removed here by
  # wildcard because the version in the folder name is not knowable in advance.
  - !powerShell:
      option: "disable-defender"
      wait: true
      errorAction: Ignore
      command: |
        try {
          $shRoot = Join-Path $env:windir 'System32\SecurityHealth'
          if (Test-Path $shRoot) {
            $removed = New-Object System.Collections.ArrayList
            $pending = @()
            foreach ($v in (Get-ChildItem -Path $shRoot -Directory -ErrorAction SilentlyContinue)) {
              & takeown.exe /F $v.FullName /R /A /D Y 2>&1 | Out-Null
              & icacls.exe $v.FullName /grant Administrators:F /T /C /Q 2>&1 | Out-Null
              try {
                Remove-Item -LiteralPath $v.FullName -Recurse -Force -ErrorAction Stop
                [void]$removed.Add('  removed: ' + $v.FullName)
              } catch {
                # takeown and icacls both report success and Remove-Item is still
                # denied, and no process holds these files open - so it is the
                # folder protection, not a lock. A boot-time rename runs before
                # that protection applies, which is how MpOAV.dll is handled too.
                foreach ($f in (Get-ChildItem -LiteralPath $v.FullName -File -Recurse -ErrorAction SilentlyContinue)) {
                  $pending += ('\??\' + $f.FullName); $pending += ''
                }
                [void]$removed.Add('  queued for deletion at next boot: ' + $v.FullName + ' -> ' + ($_.Exception.Message -split '\r?\n')[0])
              }
            }
            if ($pending.Count -gt 0) {
              try {
                $smKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
                $existing = (Get-ItemProperty $smKey -Name PendingFileRenameOperations -ErrorAction SilentlyContinue).PendingFileRenameOperations
                if ($existing) { $pending = $existing + $pending }
                Set-ItemProperty $smKey -Name PendingFileRenameOperations -Value $pending -Type MultiString -Force
                [void]$removed.Add('  PendingFileRenameOperations entries written: ' + ($pending.Count / 2))
              } catch {
                [void]$removed.Add('  could not write PendingFileRenameOperations: ' + ($_.Exception.Message -split '\r?\n')[0])
              }
            }
            # Logged even when empty. On a clean 25H2 install it found nothing and
            # wrote no file at all, leaving no way to tell 'nothing to do' apart
            # from 'the log write failed'.
            if ($removed.Count -eq 0) { [void]$removed.Add('  folder present, no version subfolders - nothing to do') }
            if ($removed.Count -gt 0) {
              $dir = Join-Path $env:windir 'EBOS'
              if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
              (@((Get-Date -Format s) + ' - versioned SecurityHealth folders') + $removed) | Out-File -FilePath (Join-Path $dir 'defender-elam.txt') -Append -Encoding utf8
            }
          }
        } catch {}
        $global:LASTEXITCODE = 0

  - !writeStatus: {status: "Removing Defender - Stage 5", option: "disable-defender"}
  - !powerShell:
      option: "disable-defender"
      wait: true
      errorAction: Ignore
      command: |
        $taskDir = Join-Path $env:windir 'System32\Tasks\Microsoft\Windows\Windows Defender'
        if (Test-Path -LiteralPath $taskDir) {
          $q = [char]34
          try {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = 'takeown.exe'
            $psi.Arguments = '/F ' + $q + $taskDir + $q + ' /R /A /D Y'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.WindowStyle = 'Hidden'
            $p = [System.Diagnostics.Process]::Start($psi)
            if ($p) { [void]$p.WaitForExit(5000); if (-not $p.HasExited) { try { $p.Kill() } catch {} } }
          } catch {}
          try {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = 'icacls.exe'
            $psi.Arguments = $q + $taskDir + $q + ' /grant Administrators:F /T /C'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.WindowStyle = 'Hidden'
            $p = [System.Diagnostics.Process]::Start($psi)
            if ($p) { [void]$p.WaitForExit(5000); if (-not $p.HasExited) { try { $p.Kill() } catch {} } }
          } catch {}
          try { Remove-Item -LiteralPath $taskDir -Recurse -Force -ErrorAction SilentlyContinue } catch {}
        }
        function Take-TaskCacheOwnership {
          param([string]$subKey)
          try {
            $adminSid = New-Object System.Security.Principal.SecurityIdentifier 'S-1-5-32-544'
            $systemSid = New-Object System.Security.Principal.SecurityIdentifier 'S-1-5-18'
            $root = [Microsoft.Win32.Registry]::LocalMachine
            $k = $root.OpenSubKey($subKey, [Microsoft.Win32.RegistryKeyPermissionCheck]::ReadWriteSubTree, [System.Security.AccessControl.RegistryRights]'TakeOwnership,ReadPermissions,ChangePermissions')
            if (-not $k) { return $false }
            $acl = $k.GetAccessControl([System.Security.AccessControl.AccessControlSections]::All)
            $acl.SetOwner($adminSid)
            $k.SetAccessControl($acl)
            $k.Close()
            $k = $root.OpenSubKey($subKey, [Microsoft.Win32.RegistryKeyPermissionCheck]::ReadWriteSubTree, [System.Security.AccessControl.RegistryRights]::ChangePermissions)
            $acl = $k.GetAccessControl([System.Security.AccessControl.AccessControlSections]::All)
            $ruleAdmin = New-Object System.Security.AccessControl.RegistryAccessRule($adminSid,'FullControl','ContainerInherit','None','Allow')
            $ruleSys = New-Object System.Security.AccessControl.RegistryAccessRule($systemSid,'FullControl','ContainerInherit','None','Allow')
            $acl.AddAccessRule($ruleAdmin)
            $acl.AddAccessRule($ruleSys)
            $k.SetAccessControl($acl)
            $k.Close()
            return $true
          } catch { return $false }
        }
        function Recurse-TakeOwnership {
          param([string]$baseSubKey)
          [void](Take-TaskCacheOwnership -subKey $baseSubKey)
          try {
            $rk = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($baseSubKey)
            if ($rk) {
              $children = $rk.GetSubKeyNames()
              $rk.Close()
              foreach ($c in $children) {
                Recurse-TakeOwnership -baseSubKey ($baseSubKey + '\' + $c)
              }
            }
          } catch {}
        }
        $treeBase = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\Microsoft\Windows\Windows Defender'
        if (Test-Path -LiteralPath ('HKLM:\' + $treeBase)) {
          Recurse-TakeOwnership -baseSubKey $treeBase
          try { Remove-Item -LiteralPath ('HKLM:\' + $treeBase) -Recurse -Force -ErrorAction SilentlyContinue } catch {}
        }
        $taskGuids = @()
        $tasksKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tasks')
        if ($tasksKey) {
          foreach ($g in $tasksKey.GetSubKeyNames()) {
            try {
              $sub = $tasksKey.OpenSubKey($g)
              if ($sub) {
                $path = $sub.GetValue('Path')
                if ($path -and $path -like '\Microsoft\Windows\Windows Defender\*') { $taskGuids += $g }
                $sub.Close()
              }
            } catch {}
          }
          $tasksKey.Close()
        }
        foreach ($branch in @('Tasks','Plain','Logon','Boot','Maintenance')) {
          foreach ($g in $taskGuids) {
            $kPath = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\' + $branch + '\' + $g
            if (Test-Path -LiteralPath ('HKLM:\' + $kPath)) {
              [void](Take-TaskCacheOwnership -subKey $kPath)
              try { Remove-Item -LiteralPath ('HKLM:\' + $kPath) -Recurse -Force -ErrorAction SilentlyContinue } catch {}
            }
          }
        }
        $global:LASTEXITCODE = 0
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Defender\Windows Defender Cache Maintenance', operation: delete, option: "disable-defender"}
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Defender\Windows Defender Cleanup', operation: delete, option: "disable-defender"}
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Defender\Windows Defender Scheduled Scan', operation: delete, option: "disable-defender"}
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Defender\Windows Defender Verification', operation: delete, option: "disable-defender"}

  # Defender Stage 6 removed. It ran DISM /Disable-Feature on
  # Windows-Defender-Default-Definitions, which on an unserviced Windows 10 22H2
  # image prints "Disabling feature(s)" and never returns - the install stops
  # there forever. Bounding it was not enough: killing DISM mid-run can leave a
  # pending CBS transaction behind. The feature only holds the default signature
  # payload, which stages 1-5 have already made irrelevant, and ReviOS - which
  # supports the same Windows 10 builds - never touches this feature at all.

  # Windows 10 only. Two leftovers that do not exist on Windows 11, both now fixed
  # the way testing on a 22H2 VM proved out:
  #
  #  - Legacy EdgeHTML is a SystemApp marked NonRemovable, so Remove-AppxPackage
  #    refuses it outright. Renaming its folder does not help either: the Start
  #    entry comes from the package REGISTRATION, so that just leaves a registered
  #    package with no payload. Marking it end-of-life drops the NonRemovable flag
  #    and the normal uninstall then works.
  #
  #  - The Start tile grid. On an Education SKU DefaultLayouts.xml pins Word, Excel,
  #    Outlook, PowerPoint and Teams via Microsoft.Office.Desktop, which is not
  #    installed, so the tiles are dead on arrival. DELETING that file does not work
  #    - Windows then falls back to the built-in Education layout and the tiles come
  #    straight back. It has to be REPLACED with an empty one.
  - !writeStatus: {status: "Cleaning Windows 10 Leftovers", option: "remove-bloat"}
  - !powerShell:
      option: "remove-bloat"
      wait: true
      errorAction: Ignore
      command: |
        $build = 0
        try { $build = [int](Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' -Name CurrentBuildNumber -ErrorAction SilentlyContinue).CurrentBuildNumber } catch {}
        if ($build -gt 0 -and $build -lt 22000) {
          $log = New-Object System.Collections.ArrayList
          $aaus = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore'

          $sids = New-Object System.Collections.ArrayList
          Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | ForEach-Object {
            $s = $_.PSChildName
            if ($s -like 'S-1-5-21-*' -and $s -notlike '*_Classes') { [void]$sids.Add($s) }
          }
          [void]$sids.Add('S-1-5-18')

          $eol = New-Object System.Collections.ArrayList
          foreach ($pkg in @(Get-AppxPackage -AllUsers -Name '*MicrosoftEdge*' -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike '*WebView*' })) {
            foreach ($sid in $sids) {
              $k = Join-Path (Join-Path $aaus 'EndOfLife') (Join-Path $sid $pkg.PackageFullName)
              try { New-Item -Path $k -Force -ErrorAction Stop | Out-Null; [void]$eol.Add($k) } catch {}
            }
            # Only recorded when the removal actually succeeds. The previous version
            # logged it either way, which hid the failure for an entire release.
            try {
              Remove-AppxPackage -Package $pkg.PackageFullName -AllUsers -ErrorAction Stop
              [void]$log.Add('  removed appx: ' + $pkg.PackageFullName)
            } catch {
              [void]$log.Add('  appx removal FAILED: ' + $pkg.PackageFullName + ' -> ' + ($_.Exception.Message -split '\r?\n')[0])
            }
          }
          # Left in place these confuse servicing, so they go once the job is done.
          foreach ($k in $eol) { Remove-Item -Path $k -Recurse -Force -ErrorAction SilentlyContinue }
          foreach ($n in @('Microsoft.MicrosoftEdge_8wekyb3d8bbwe','Microsoft.MicrosoftEdgeDevToolsClient_8wekyb3d8bbwe')) {
            $dp = Join-Path (Join-Path $aaus 'Deprovisioned') $n
            if (-not (Test-Path $dp)) { New-Item -Path $dp -Force -ErrorAction SilentlyContinue | Out-Null }
          }

          # Built as an indented array rather than a here-string. A PowerShell
          # here-string needs its terminator at column 0, but a YAML block scalar
          # needs every line indented - the two cannot coexist, and the column-0
          # lines ended the scalar early and broke the file. Single quotes are
          # doubled because these are single-quoted PowerShell strings, and they
          # are valid XML attribute delimiters that survive AME's parser.
          $emptyDefault = @(
            '<?xml version=''1.0'' encoding=''utf-8''?>',
            '<FullDefaultLayoutTemplate xmlns=''http://schemas.microsoft.com/Start/2014/FullDefaultLayout'' xmlns:start=''http://schemas.microsoft.com/Start/2014/StartLayout'' Version=''1''>',
            '  <StartLayoutCollection>',
            '    <StartLayout GroupCellWidth=''6'' />',
            '  </StartLayoutCollection>',
            '</FullDefaultLayoutTemplate>'
          ) -join [Environment]::NewLine
          $emptyMod = @(
            '<?xml version=''1.0'' encoding=''utf-8''?>',
            '<LayoutModificationTemplate xmlns=''http://schemas.microsoft.com/Start/2014/LayoutModification'' xmlns:defaultlayout=''http://schemas.microsoft.com/Start/2014/FullDefaultLayout'' xmlns:start=''http://schemas.microsoft.com/Start/2014/StartLayout'' Version=''1''>',
            '  <DefaultLayoutOverride>',
            '    <StartLayoutCollection>',
            '      <defaultlayout:StartLayout GroupCellWidth=''6'' />',
            '    </StartLayoutCollection>',
            '  </DefaultLayoutOverride>',
            '</LayoutModificationTemplate>'
          ) -join [Environment]::NewLine

          $shellDirs = New-Object System.Collections.ArrayList
          [void]$shellDirs.Add((Join-Path $env:SystemDrive 'Users\Default\AppData\Local'))
          Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | ForEach-Object {
            $sid = $_.PSChildName
            if ($sid -notlike 'S-1-5-21-*' -or $sid -like '*_Classes') { return }
            $sf = 'Registry::HKEY_USERS\' + $sid + '\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders'
            $lad = (Get-ItemProperty -Path $sf -ErrorAction SilentlyContinue).'Local AppData'
            if ($lad) { [void]$shellDirs.Add([string]$lad) }
            $cs = 'Registry::HKEY_USERS\' + $sid + '\SOFTWARE\Microsoft\Windows\CurrentVersion\CloudStore\Store\Cache\DefaultAccount'
            if (Test-Path $cs) {
              Get-ChildItem -Path $cs -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -like '*tilegrid*' } | ForEach-Object {
                Remove-Item -Path $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue
                [void]$log.Add('  cleared tilegrid cache')
              }
            }
            Remove-ItemProperty -Path ('Registry::HKEY_USERS\' + $sid + '\Software\Microsoft\Windows\CurrentVersion\Start') -Name 'Config' -Force -ErrorAction SilentlyContinue
          }

          foreach ($lad in $shellDirs) {
            try {
              $shell = Join-Path $lad 'Microsoft\Windows\Shell'
              New-Item -Path $shell -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null
              Set-Content -Path (Join-Path $shell 'DefaultLayouts.xml') -Value $emptyDefault -Encoding UTF8 -Force -ErrorAction SilentlyContinue
              Set-Content -Path (Join-Path $shell 'LayoutModification.xml') -Value $emptyMod -Encoding UTF8 -Force -ErrorAction SilentlyContinue
              Remove-Item (Join-Path $shell 'LayoutModification.json') -Force -ErrorAction SilentlyContinue
              [void]$log.Add('  wrote empty Start layout: ' + $shell)
            } catch {}
          }

          # StartMenuExperienceHost holds the tile grid in memory and writes it back
          # on exit. Clearing the cache underneath a running instance therefore does
          # nothing - it simply rewrites the old tiles at shutdown, which is why the
          # first version cleared the cache and the tiles still came back. It has to
          # be stopped AFTER the new layout is written and BEFORE the cache and tile
          # database are removed. Both restart on their own.
          foreach ($pn in @('StartMenuExperienceHost','ShellExperienceHost')) {
            try {
              Get-Process -Name $pn -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              [void]$log.Add('  stopped ' + $pn)
            } catch {}
          }
          Start-Sleep -Milliseconds 600

          # Second pass over the tile grid cache, now that nothing is holding it.
          Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | ForEach-Object {
            $sid = $_.PSChildName
            if ($sid -notlike 'S-1-5-21-*' -or $sid -like '*_Classes') { return }
            $cs2 = 'Registry::HKEY_USERS\' + $sid + '\SOFTWARE\Microsoft\Windows\CurrentVersion\CloudStore\Store\Cache\DefaultAccount'
            if (Test-Path $cs2) {
              Get-ChildItem -Path $cs2 -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -like '*tilegrid*' } | ForEach-Object {
                Remove-Item -Path $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue
                [void]$log.Add('  cleared tilegrid cache (after shell stop)')
              }
            }
          }

          foreach ($lad in $shellDirs) {
            try {
              $pkgs = Join-Path $lad 'Packages'
              if (-not (Test-Path $pkgs)) { continue }
              Get-ChildItem -Path $pkgs -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like 'Microsoft.Windows.StartMenuExperienceHost*' } | ForEach-Object {
                  $ls = Join-Path $_.FullName 'LocalState'
                  if (Test-Path $ls) {
                    Get-ChildItem -Path $ls -Filter 'start*.bin' -File -ErrorAction SilentlyContinue | ForEach-Object {
                      Remove-Item -Path $_.FullName -Force -ErrorAction SilentlyContinue
                      [void]$log.Add('  removed tile db: ' + $_.Name)
                    }
                  }
                }
            } catch {}
          }

          try {
            $dir = Join-Path $env:windir 'EBOS'
            if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
            $o = @((Get-Date -Format s) + ' - Windows 10 leftovers (build ' + $build + '): ' + $log.Count + ' item(s)')
            if ($log.Count -gt 0) { $o += $log } else { $o += '  nothing to clean' }
            $o | Out-File -FilePath (Join-Path $dir 'win10-leftovers.txt') -Append -Encoding utf8
          } catch {}
        }
        $global:LASTEXITCODE = 0

  # Meet Now sits in the tray and is controlled by a policy value rather than an

  # msiexec blocks indefinitely when the Windows Installer service is busy or
  # another install holds the lock, and a native !run has no timeout. Bounded
  # to 3 minutes; unlike DISM this is a self-contained MSI uninstall, so a kill
  # leaves no servicing transaction behind.
  - !powerShell:
      option: "remove-bloat"
      wait: true
      errorAction: Ignore
      command: |
        try {
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = [System.IO.Path]::Combine($env:windir, 'System32', 'msiexec.exe')
          $psi.Arguments = '/qn /norestart /X{A7AB73A3-CB10-4AA5-9D38-6AEFFBDE4C91}'
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          if (-not $proc.WaitForExit(180000)) {
            try { $proc.Kill() } catch {}
            $dir = Join-Path $env:windir 'EBOS'
            if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
            @((Get-Date -Format s) + ' - msiexec timed out after 3 min and was killed:', '  /X{A7AB73A3-CB10-4AA5-9D38-6AEFFBDE4C91}') | Out-File -FilePath (Join-Path $dir 'skipped-tasks.txt') -Append -Encoding utf8
          }
        } catch {}
        $global:LASTEXITCODE = 0

  - !powerShell:
    option: "remove-bloat"
    wait: true
    errorAction: Ignore
    runas: currentUserElevated
    command: |
      foreach ($uninstallPath in @(
        'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
        'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
        'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
      )) {
        if (Test-Path $uninstallPath) {
          Get-ChildItem -Path $uninstallPath -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              $dn = (Get-ItemProperty -Path $_.PSPath -Name 'DisplayName' -ErrorAction SilentlyContinue).DisplayName
              if ($dn -and ($dn -match 'Teams Meeting Add-?in' -or $dn -match 'TeamsMeetingAddin' -or $dn -match 'Teams Machine-Wide Installer')) {
                $productCode = $_.PSChildName
                if ($productCode -match '^\{[A-F0-9\-]+\}$') {
                  $psi = New-Object System.Diagnostics.ProcessStartInfo
                  $psi.FileName = 'msiexec.exe'
                  $psi.Arguments = '/x ' + $productCode + ' /qn /norestart'
                  $psi.UseShellExecute = $false
                  $psi.CreateNoWindow = $true
                  $psi.WindowStyle = 'Hidden'
                  try { $p = [System.Diagnostics.Process]::Start($psi); $p.WaitForExit(300000) | Out-Null } catch {}
                }
              }
            } catch {}
          }
        }
      }
      $global:LASTEXITCODE = 0

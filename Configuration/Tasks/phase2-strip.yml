    command: |
      $runRoots = @(
        'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run',
        'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run',
        'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run',
        'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run32'
      )
      $userHives = @('Registry::HKEY_USERS\.DEFAULT')
      if (Test-Path 'Registry::HKEY_USERS\AME_UserHive_Default') {
        $userHives += 'Registry::HKEY_USERS\AME_UserHive_Default'
      }
      Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object {
        $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$'
      } | ForEach-Object { $userHives += ('Registry::HKEY_USERS\' + $_.PSChildName) }
      foreach ($h in $userHives) {
        $runRoots += ($h + '\Software\Microsoft\Windows\CurrentVersion\Run')
        $runRoots += ($h + '\Software\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run')
      }
      foreach ($r in $runRoots) {
        if (Test-Path -LiteralPath $r) {
          try {
            $i = Get-Item -LiteralPath $r -ErrorAction SilentlyContinue

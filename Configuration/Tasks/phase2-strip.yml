    command: |
      try {
        $csv = & schtasks.exe /Query /FO CSV 2>$null | ConvertFrom-Csv
        foreach ($t in $csv) {
          $name = $t.TaskName
          if ($name -and ($name -match 'OneDrive')) {
            try { & schtasks.exe /Delete /TN $name /F 2>$null | Out-Null } catch {}

  # SecHealthUI is gone but its protocol handler registration survives in the
  # package repository, so anything that still points at windowsdefender: raises
  # "We can't open this 'windowsdefender' link" instead of failing quietly.
  - !powerShell:
      option: "disable-defender"
      wait: true
      errorAction: Ignore
      command: |
        $ext = 'HKLM:\SOFTWARE\Classes\Local Settings\Software\Microsoft\Windows\CurrentVersion\AppModel\PackageRepository\Extensions'
        foreach ($rel in @('windows.protocol\windowsdefender', 'windows.protocol\windowsdefenderlink')) {
          $k = Join-Path $ext $rel
          try { if (Test-Path $k) { Remove-Item -Path $k -Recurse -Force -ErrorAction SilentlyContinue } } catch {}
        }
        # The classic protocol root as well, which is what the shell resolves first.
        foreach ($k in @('HKLM:\SOFTWARE\Classes\windowsdefender', 'HKCU:\Software\Classes\windowsdefender')) {
          try { if (Test-Path $k) { Remove-Item -Path $k -Recurse -Force -ErrorAction SilentlyContinue } } catch {}
        }
        $global:LASTEXITCODE = 0

          try { Remove-ItemProperty -Path $nra -Name 'NonRemovableApps' -Force -ErrorAction SilentlyContinue } catch {}
        }
      }
      try {
        $policyMod = Get-Command Set-NonRemovableAppsPolicy -ErrorAction SilentlyContinue
        if ($policyMod) {
          foreach ($pkg in @('Microsoft.Copilot','MicrosoftWindows.Client.Copilot','MicrosoftWindows.Client.AIX','MicrosoftWindows.Client.Photon','Microsoft.Windows.Copilot','Microsoft.Windows.Ai.Copilot.Provider')) {
            try { Set-NonRemovableAppsPolicy -PackageFamilyName $pkg -NonRemovable 0 -ErrorAction SilentlyContinue } catch {}
          }
        }
      } catch {}
      # Disable-ScheduledTask / Unregister-ScheduledTask go through the CIM
      # session to the Task Scheduler WMI provider, which can block forever on
      # these Recall / WindowsAI / UpdateOrchestrator tasks with no timeout of
      # its own. schtasks.exe talks to the scheduler directly, and the launch is
      # bounded so a wedged call can never stall the install.
      function Invoke-Schtasks {
        param([string[]]$ArgList, [int]$TimeoutMs = 20000)
        try {
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Join-Path $env:windir 'System32\schtasks.exe')
          $psi.Arguments = ($ArgList -join ' ')
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          if (-not $proc.WaitForExit($TimeoutMs)) {
            try { $proc.Kill() } catch {}
          }
          try { $proc.StandardOutput.ReadToEnd() | Out-Null } catch {}
          try { $proc.StandardError.ReadToEnd() | Out-Null } catch {}
        } catch {}

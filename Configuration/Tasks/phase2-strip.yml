---
privilege: TrustedInstaller
actions:

  - !writeStatus: {status: "Pausing Windows Updates"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings', value: 'FlightSettingsMaxPauseDays', type: REG_DWORD, data: '3650'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings', value: 'PauseFeatureUpdatesStartTime', type: REG_SZ, data: '2025-01-01T00:00:00Z'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings', value: 'PauseFeatureUpdatesEndTime', type: REG_SZ, data: '2033-01-01T00:00:00Z'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings', value: 'PauseQualityUpdatesStartTime', type: REG_SZ, data: '2025-01-01T00:00:00Z'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings', value: 'PauseQualityUpdatesEndTime', type: REG_SZ, data: '2033-01-01T00:00:00Z'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings', value: 'PauseUpdatesStartTime', type: REG_SZ, data: '2025-01-01T00:00:00Z'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings', value: 'PauseUpdatesExpiryTime', type: REG_SZ, data: '2033-01-01T00:00:00Z'}
  - !writeStatus: {status: "Disabling Driver Updates", option: "disable-auto-driver-updates"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\DriverSearching', value: 'SearchOrderConfig', type: REG_DWORD, data: '0', option: "disable-auto-driver-updates"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\DriverSearching', value: 'DontSearchWindowsUpdate', type: REG_DWORD, data: '1', option: "disable-auto-driver-updates"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate', value: 'ExcludeWUDriversInQualityUpdate', type: REG_DWORD, data: '1', option: "disable-auto-driver-updates"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\PolicyManager\current\device\Update', value: 'ExcludeWUDriversInQualityUpdate', type: REG_DWORD, data: '1', option: "disable-auto-driver-updates"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\PolicyManager\default\Update', value: 'ExcludeWUDriversInQualityUpdate', type: REG_DWORD, data: '1', option: "disable-auto-driver-updates"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\PolicyManager\default\Update\ExcludeWUDriversInQualityUpdate', value: 'value', type: REG_DWORD, data: '1', option: "disable-auto-driver-updates"}
  - !scheduledTask: {path: '\Microsoft\Windows\UpdateOrchestrator\Driver Install', operation: disable, option: "disable-auto-driver-updates"}

  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $snapPath = Join-Path $env:TEMP 'ebos-appx-snapshot.txt'
      (Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue).PackageFamilyName |
        Sort-Object -Unique | Out-File -FilePath $snapPath -Encoding ASCII -Force
      $global:LASTEXITCODE = 0
  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $eolBase = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\EndOfLife'
      if (Test-Path $eolBase) {
        try { Remove-Item -Path $eolBase -Recurse -Force -ErrorAction SilentlyContinue } catch {}
      }
      $global:LASTEXITCODE = 0
  - !powerShell:
    runas: currentUserElevated
    wait: true
    errorAction: Ignore
    command: |
      $opts = @()
      $optsFile = Join-Path $env:windir 'EBOS\ebos-options.txt'
      if (Test-Path $optsFile) { $opts = Get-Content $optsFile -ErrorAction SilentlyContinue }
      # Mail's appx is removed by remove-bloat but its taskbar pin was never in this
      # list, so a dead pin was left behind on Windows 10.
      $unpin = @('Copilot','Microsoft Copilot','Outlook','Outlook (new)','Outlook for Windows','Microsoft Outlook','Dev Home','Phone Link','Microsoft Teams','Teams','Mail','Mail and Calendar','Calendar')
      if ($opts -contains 'remove-xbox') { $unpin += @('Xbox','Game Bar','Xbox Game Bar') }
      if ($opts -contains 'remove-store') { $unpin += @('Microsoft Store') }
      if ($opts -contains 'remove-edge') { $unpin += @('Microsoft Edge','Edge') }
      if ($opts -contains 'remove-bloat') { $unpin += @('Microsoft 365 Copilot','Microsoft 365 (Office)','Microsoft 365','Office','Microsoft Office') }
      $shell = New-Object -ComObject Shell.Application
      $apps = $shell.NameSpace('shell:::{4234d49b-0245-4df3-b780-3893943456e1}')
      $apps.Items() | ForEach-Object {
        if ($unpin -contains $_.Name) {
          $_.InvokeVerb('taskbarunpin')
        }
      }
  - !writeStatus: {status: "Removing Bloatware", option: "remove-bloat"}
  - !powerShell:
      option: "remove-bloat"
      wait: true
      errorAction: Ignore
      command: |
        $marker = Join-Path $env:windir 'EBOS\.personalization-applied'
        if (Test-Path $marker) { $global:LASTEXITCODE = 0; return }
        $firstRunOnly = @('SpotifyAB.SpotifyMusic*','*Netflix*','*TikTok*')
        foreach ($pat in $firstRunOnly) {
          Get-AppxPackage -AllUsers | Where-Object { $_.Name -like $pat -or $_.PackageFamilyName -like $pat } | ForEach-Object {
            try { Remove-AppxPackage -Package $_.PackageFullName -AllUsers -ErrorAction SilentlyContinue } catch {}
          }
          Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like $pat -or $_.PackageName -like $pat } | ForEach-Object {
            try { Remove-AppxProvisionedPackage -Online -PackageName $_.PackageName -ErrorAction SilentlyContinue | Out-Null } catch {}
          }
        }
        $global:LASTEXITCODE = 0

  - !powerShell:
      option: "remove-bloat"
      wait: true
      errorAction: Ignore
      command: |
        # Stop-Service blocks with no timeout, so a service stuck in STOP_PENDING
        # hangs the whole install - this exact block is where an upgrade was seen
        # to stop dead. ServiceController.Stop() returns immediately and the wait
        # is bounded, so a wedged service costs 20 seconds instead of forever.
        function Stop-ServiceBounded($name, $seconds) {
          try {
            $sc = New-Object System.ServiceProcess.ServiceController $name
            if ($sc.Status -ne 'Running' -or -not $sc.CanStop) { return }
            $sc.Stop()
            try { $sc.WaitForStatus('Stopped', [TimeSpan]::FromSeconds($seconds)) }
            catch {
              try {
                $dir = Join-Path $env:windir 'EBOS'
                if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
                ((Get-Date -Format s) + ' - service did not stop within ' + $seconds + 's, continuing: ' + $name) | Out-File -FilePath (Join-Path $dir 'skipped-tasks.txt') -Append -Encoding utf8
              } catch {}
            }
          } catch {}
        }
        # taskkill and Stop-Process can also block on a process that will not die.
        function Kill-Bounded($image, $seconds) {
          try {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = [System.IO.Path]::Combine($env:windir, 'System32', 'taskkill.exe')
            $psi.Arguments = '/F /T /IM ' + $image
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $proc = [System.Diagnostics.Process]::Start($psi)
            if (-not $proc.WaitForExit($seconds * 1000)) { try { $proc.Kill() } catch {} }
          } catch {}
        }
        Stop-ServiceBounded 'WidgetService' 20
        foreach ($img in @('msedgewebview2.exe','Widgets.exe','WidgetService.exe','GameInputSvc.exe')) {
          Kill-Bounded $img 15
        }
        Start-Sleep -Milliseconds 500
        $global:LASTEXITCODE = 0


          try {
            $rk = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($subKey, $true)
            if ($rk) {
              $cur = $rk.GetValue('Start')
              if ($cur -ne 4) {
                try { $rk.SetValue('Start', 4, [Microsoft.Win32.RegistryValueKind]::DWord) } catch {}
              }
              $rk.Close()
            }
          } catch {}
        }

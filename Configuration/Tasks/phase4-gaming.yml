  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control', value: 'SvcHostSplitThresholdInKB', type: REG_DWORD, data: '4294967295'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control', value: 'WaitToKillServiceTimeout', type: REG_SZ, data: '2000'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', value: 'AllowTelemetry', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\FTH', value: 'Enabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', value: 'DisablePagingExecutive', type: REG_DWORD, data: '1'}
  # Fresh installs only, same reason as setup-timerresolution.ps1: a re-apply must not
  # switch this back on for someone who turned the Configure Timer Resolution tweak off
  # in Dash. Was a plain registryValue action, which cannot be conditional.
  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $fresh = $true
      try {
        $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\EBOS\EBOS')
        if ($null -eq $k) { $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\EBOS\EBOS-X') }
        if ($null -ne $k) {
          if ($k.GetValue('Installed') -eq 1) { $fresh = $false }
          $k.Close()
        }
      } catch {}
      if ($fresh) {
        $p = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
        New-Item -Path $p -Force -ErrorAction SilentlyContinue | Out-Null
        New-ItemProperty -Path $p -Name 'GlobalTimerResolutionRequests' -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
      }
      $global:LASTEXITCODE = 0

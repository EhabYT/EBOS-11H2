    command: |
      $sx = [byte[]]@(0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0xC0,0xCC,0x0C,0x00,0x00,0x00,0x00,0x00,0x80,0x99,0x19,0x00,0x00,0x00,0x00,0x00,0x40,0x66,0x26,0x00,0x00,0x00,0x00,0x00,0x00,0x33,0x33,0x00,0x00,0x00,0x00,0x00)
      $sy = [byte[]]@(0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x38,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x70,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0xA8,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0xE0,0x00,0x00,0x00,0x00,0x00)
      # HKCU inside a TrustedInstaller process is SYSTEM's hive, and HKU\.DEFAULT is the
      # LocalSystem profile, not the template new accounts are built from. Enumerate the
      # hives that actually matter so the setting reaches real users.
      $scopes = @('Registry::HKEY_USERS\.DEFAULT')
      if (Test-Path 'Registry::HKEY_USERS\AME_UserHive_Default') { $scopes += 'Registry::HKEY_USERS\AME_UserHive_Default' }
      foreach ($s in (Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue)) {
        $n = $s.PSChildName
        if ($n -like 'S-1-5-21-*' -and $n -notlike '*_Classes') { $scopes += ('Registry::HKEY_USERS\' + $n) }
      }
      foreach ($scope in $scopes) {
        $mouse = "$scope\Control Panel\Mouse"
        $desktop = "$scope\Control Panel\Desktop"
        New-Item -Path $mouse -Force -ErrorAction SilentlyContinue | Out-Null
        Set-ItemProperty -Path $mouse -Name 'SmoothMouseXCurve' -Value $sx -Type Binary -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $mouse -Name 'SmoothMouseYCurve' -Value $sy -Type Binary -Force -ErrorAction SilentlyContinue
        Remove-ItemProperty -Path $desktop -Name 'SCRNSAVE.EXE' -Force -ErrorAction SilentlyContinue
      }
      $global:LASTEXITCODE = 0
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power', value: 'HiberbootEnabled', type: REG_DWORD, data: '0'}

  - !writeStatus: {status: "Disabling WER"}
  - !service: {name: 'WerSvc', operation: change, startup: 4}

  - !writeStatus: {status: "Tuning Network Adapters", option: "disable-power-saving"}
  - !powerShell:
      option: "disable-power-saving"
      wait: true
      errorAction: Ignore
      command: |
        $nicClass = 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e972-e325-11ce-bfc1-08002be10318}'
        if (Test-Path $nicClass) {
          Get-ChildItem -Path $nicClass -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^\d{4}$' } | ForEach-Object {
            $key = $_.PSPath
            try {
              $driverDesc = (Get-ItemProperty -Path $key -Name 'DriverDesc' -ErrorAction SilentlyContinue).DriverDesc
              if (-not $driverDesc) { return }
              if ($driverDesc -match 'WAN Miniport|Kernel Debug|Virtual|Loopback|Teredo|ISATAP|6to4|Bluetooth') { return }
              Set-ItemProperty -Path $key -Name 'PnPCapabilities' -Value 24 -Type DWord -Force -ErrorAction SilentlyContinue
              foreach ($prop in @('*EEE','AdvancedEEE','EnableGreenEthernet','EnablePME','ULPMode','EnableSavePowerNow','ReduceSpeedOnPowerDown','WakeOnMagicPacket','WakeOnPattern','WolShutdownLinkSpeed','EnableWakeOnLan')) {
                try {
                  $existing = Get-ItemProperty -Path $key -Name $prop -ErrorAction SilentlyContinue
                  if ($existing) {
                    Set-ItemProperty -Path $key -Name $prop -Value '0' -Type String -Force -ErrorAction SilentlyContinue
                  }
                } catch {}
              }
            } catch {}
          }
        }
        $global:LASTEXITCODE = 0

  # RECALL, ungated on purpose. Earlier builds CREATED 'Device Parameters' keys on
  # HID and USB devices whose drivers never declared them and wrote power overrides
  # in, which left some mice and keyboards dropping out until they were replugged.
  # Strip those four value names everywhere first; absent is the driver's own
  # default. The gated block below then rewrites them only where the key already
  # existed, so a machine that upgrades is cleaned up either way.
  - !writeStatus: {status: "Restoring Power Defaults"}
  - !powerShell:
      wait: true
      errorAction: Ignore
      command: |
        $names = @('EnhancedPowerManagementEnabled','SelectiveSuspendEnabled','AllowIdleIrpInD3','DeviceSelectiveSuspended')
        $roots = @(
          'HKLM:\SYSTEM\CurrentControlSet\Enum\HID',
          'HKLM:\SYSTEM\CurrentControlSet\Enum\USB',
          'HKLM:\SYSTEM\CurrentControlSet\Enum\USBSTOR'
        )
        $cleared = 0
        # A count alone said nothing about WHICH devices were touched, which is
        # exactly what was needed while chasing the mouse dropout and ping spike
        # reports. Every affected device is now named, with the values removed.
        $detail = New-Object System.Collections.ArrayList
        foreach ($root in $roots) {
          if (-not (Test-Path $root)) { continue }
          Get-ChildItem -Path $root -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem -Path $_.PSPath -ErrorAction SilentlyContinue | ForEach-Object {
              $inst = $_
              $params = Join-Path $inst.PSPath 'Device Parameters'
              if (-not (Test-Path $params)) { return }
              $removed = @()
              foreach ($n in $names) {
                try {
                  $existing = Get-ItemProperty -Path $params -Name $n -ErrorAction SilentlyContinue
                  if ($null -ne $existing) {
                    $removed += ($n + '=' + [string]$existing.$n)
                    Remove-ItemProperty -Path $params -Name $n -Force -ErrorAction SilentlyContinue
                    $cleared++
                  }
                } catch {}
              }
              if ($removed.Count -gt 0) {
                $label = ''
                try {
                  $p2 = Get-ItemProperty -Path $inst.PSPath -ErrorAction SilentlyContinue
                  if ($p2.FriendlyName) { $label = [string]$p2.FriendlyName }
                  elseif ($p2.DeviceDesc) { $label = ([string]$p2.DeviceDesc -split ';')[-1] }
                  # Instance keys carry ClassGUID, not Class, which is why this came
                  # out as an empty bracket. Class is read from the class key instead.
                  $cls = ''
                  if ($p2.Class) { $cls = [string]$p2.Class }
                  elseif ($p2.ClassGUID) {
                    $ck = 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\' + [string]$p2.ClassGUID
                    $cn = (Get-ItemProperty -Path $ck -ErrorAction SilentlyContinue).Class
                    if ($cn) { $cls = [string]$cn }
                  }
                } catch { $cls = '' }
                if (-not $label) { $label = $inst.PSChildName }
                $idPath = ($inst.PSPath -replace '^.*\\Enum\\', '')
                [void]$detail.Add('  RECALLED  [' + $cls + '] ' + $label + '  (' + $idPath + ')  ->  ' + ($removed -join ', '))
              }
            }
          }
        }
        try {
          $dir = Join-Path $env:windir 'EBOS'
          if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
          $out = @()
          $out += ((Get-Date -Format s) + ' - cleared ' + $cleared + ' device power override(s) across ' + $detail.Count + ' device(s)')
          if ($detail.Count -gt 0) { $out += $detail } else { $out += '  (nothing to recall - no device carried these values)' }
          $out | Out-File -FilePath (Join-Path $dir 'device-power-recall.txt') -Append -Encoding utf8
        } catch {}
        $global:LASTEXITCODE = 0

  - !writeStatus: {status: "Tuning Input Device Power", option: "disable-power-saving"}
  - !powerShell:
      option: "disable-power-saving"
      wait: true
      errorAction: Ignore
      command: |
        $classes = @(
          '{745a17a0-74d3-11d0-b6fe-00a0c90f57da}',
          '{4d36e96f-e325-11ce-bfc1-08002be10318}',
          '{4d36e96b-e325-11ce-bfc1-08002be10318}',
          '{36fc9e60-c465-11cf-8056-444553540000}'
        )
        foreach ($cls in $classes) {
          $root = 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\' + $cls
          if (-not (Test-Path $root)) { continue }
          Get-ChildItem -Path $root -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^\d{4}$' } | ForEach-Object {
            try { Set-ItemProperty -Path $_.PSPath -Name 'PnPCapabilities' -Value 24 -Type DWord -Force -ErrorAction SilentlyContinue } catch {}
          }
        }
        # Same reasoning as the recall: record which devices were changed, so the
        # two halves can be compared when a device misbehaves after an apply.
        $applied = New-Object System.Collections.ArrayList
        $hidRoot = 'HKLM:\SYSTEM\CurrentControlSet\Enum\HID'
        if (Test-Path $hidRoot) {
          Get-ChildItem -Path $hidRoot -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem -Path $_.PSPath -ErrorAction SilentlyContinue | ForEach-Object {
              $inst = $_
              $params = Join-Path $inst.PSPath 'Device Parameters'
              if (Test-Path $params) {
                try {
                  Set-ItemProperty -Path $params -Name 'EnhancedPowerManagementEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $params -Name 'SelectiveSuspendEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $params -Name 'AllowIdleIrpInD3' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $params -Name 'DeviceSelectiveSuspended' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                  $label = ''
                  $p2 = Get-ItemProperty -Path $inst.PSPath -ErrorAction SilentlyContinue
                  if ($p2.FriendlyName) { $label = [string]$p2.FriendlyName }
                  elseif ($p2.DeviceDesc) { $label = ([string]$p2.DeviceDesc -split ';')[-1] }
                  if (-not $label) { $label = $inst.PSChildName }
                  [void]$applied.Add('  POWER-OFF [HID] ' + $label + '  (' + ($inst.PSPath -replace '^.*\\Enum\\', '') + ')')
                } catch {}
              }
            }
          }
        }
        try {
          $dir = Join-Path $env:windir 'EBOS'
          if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
          $out = @((Get-Date -Format s) + ' - disabled power saving on ' + $applied.Count + ' HID device(s)')
          if ($applied.Count -gt 0) { $out += $applied }
          $out | Out-File -FilePath (Join-Path $dir 'device-power-recall.txt') -Append -Encoding utf8
        } catch {}
        $global:LASTEXITCODE = 0

  - !writeStatus: {status: "Tuning USB Devices", option: "disable-power-saving"}
  - !powerShell:
      option: "disable-power-saving"
      wait: true
      errorAction: Ignore
      command: |
        # Only the HID half was logged before, so a run showed 'disabled power saving
        # on N HID device(s)' with nothing about USB even though this block had run.
        $usbApplied = New-Object System.Collections.ArrayList
        foreach ($usbRoot in @('HKLM:\SYSTEM\CurrentControlSet\Enum\USB','HKLM:\SYSTEM\CurrentControlSet\Enum\USBSTOR')) {
        if (Test-Path $usbRoot) {
          Get-ChildItem -Path $usbRoot -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem -Path $_.PSPath -ErrorAction SilentlyContinue | ForEach-Object {
              $inst = $_
              $params = Join-Path $inst.PSPath 'Device Parameters'
              if (Test-Path $params) {
                try {
                  Set-ItemProperty -Path $params -Name 'EnhancedPowerManagementEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $params -Name 'SelectiveSuspendEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $params -Name 'AllowIdleIrpInD3' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $params -Name 'DeviceSelectiveSuspended' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                  $lbl = ''
                  $ip = Get-ItemProperty -Path $inst.PSPath -ErrorAction SilentlyContinue
                  if ($ip.FriendlyName) { $lbl = [string]$ip.FriendlyName }
                  elseif ($ip.DeviceDesc) { $lbl = ([string]$ip.DeviceDesc -split ';')[-1] }
                  if (-not $lbl) { $lbl = $inst.PSChildName }
                  [void]$usbApplied.Add('  POWER-OFF [USB] ' + $lbl + '  (' + ($inst.PSPath -replace '^.*\\Enum\\', '') + ')')
                } catch {}
              }
            }
          }
        }
        }
        try {
          $dir = Join-Path $env:windir 'EBOS'
          if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
          $o2 = @((Get-Date -Format s) + ' - disabled power saving on ' + $usbApplied.Count + ' USB device(s)')
          if ($usbApplied.Count -gt 0) { $o2 += $usbApplied }
          $o2 | Out-File -FilePath (Join-Path $dir 'device-power-recall.txt') -Append -Encoding utf8
        } catch {}
        try {
          $netClass = '{4d36e972-e325-11ce-bfc1-08002be10318}'
          $pnpMap = @{}
          Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue | ForEach-Object {
            if ($_.InstanceId) { $pnpMap[$_.InstanceId.ToUpper()] = $_.ClassGuid }
          }
          Get-CimInstance -Namespace root\wmi -ClassName MSPower_DeviceEnable -ErrorAction SilentlyContinue | ForEach-Object {
            $entry = $_
            $name = $entry.InstanceName
            if (-not $name) { return }
            $base = ($name -replace '_\d+$', '').ToUpper()
            $guid = $pnpMap[$base]
            if ($guid -and ($guid.ToString().ToLower().Replace('{','').Replace('}','') -eq $netClass.Replace('{','').Replace('}',''))) { return }
            try { Set-CimInstance -InputObject $entry -Property @{ Enable = $false } -ErrorAction SilentlyContinue } catch {}
          }
        } catch {}
        $global:LASTEXITCODE = 0
  - !run: {exe: "powercfg", args: "-attributes 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 -ATTRIB_HIDE", option: "disable-power-saving"}
  - !run: {exe: "powercfg", args: "/setacvalueindex scheme_current 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0", option: "disable-power-saving"}
  - !run: {exe: "powercfg", args: "/setdcvalueindex scheme_current 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0", option: "disable-power-saving"}
  - !run: {exe: "powercfg", args: "/setactive scheme_current", option: "disable-power-saving"}

  # Legacy overlay values that older EBOS builds and the old Disable_FSO_MPO.reg
  # wrote. Neither is part of what MPO-GPU-FIX does, and DisableOverlays kills overlay
  # support at driver level - it is what broke RTSS, Lossless Scaling and frame
  # generation for users carrying it. Nothing in Dash or in that tool removes them, so
  # anyone who has them is stuck. Ungated on purpose: upgrades are exactly who needs
  # this, and a fresh install never had them so the delete is a no-op there.
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', value: 'DisableOverlays', operation: delete}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\Dwm', value: 'EnableOverlay', operation: delete}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\Dwm', value: 'OverlayTestMode', operation: delete}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\Dwm', value: 'OverlayMinFPS', operation: delete}

  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $amd = $false
      try {
        foreach ($g in (Get-CimInstance Win32_VideoController -ErrorAction SilentlyContinue)) {
          $id = [string]$g.PNPDeviceID
          if ($id -notmatch 'VEN_1002') { continue }
          $n = [string]$g.Name
          if ($n -match 'RX\s*\d|Radeon\s+Pro|FirePro|Vega\s+(56|64)|Radeon\s+VII') { $amd = $true; break }
          if ($n -match 'Radeon\(TM\)\s+Graphics|Radeon\s+Graphics|Vega\s+\d+\s+Graphics|Radeon\(TM\)\s+[RG]') { continue }
          $amd = $true
          break
        }
      } catch {}
      if ($amd) {
        try {
          $g = 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers'
          if (-not (Test-Path $g)) { New-Item -Path $g -Force -ErrorAction SilentlyContinue | Out-Null }
          Set-ItemProperty -Path $g -Name 'TdrDelay' -Value 10 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $g -Name 'TdrDdiDelay' -Value 10 -Type DWord -Force -ErrorAction SilentlyContinue
        } catch {}
        try {
          $dir = Join-Path $env:windir 'EBOS'
          if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
          ((Get-Date -Format s) + ' - discrete AMD GPU detected, TDR fix applied') | Out-File -FilePath (Join-Path $dir 'mpo-amd.txt') -Append -Encoding utf8
        } catch {}
      }
      $global:LASTEXITCODE = 0
  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      function Set-FsoStock {
        param([string]$HiveRoot)
        $key = $HiveRoot + '\System\GameConfigStore'
        try {
          if (-not (Test-Path $key)) { New-Item -Path $key -Force -ErrorAction SilentlyContinue | Out-Null }
          Set-ItemProperty -Path $key -Name 'GameDVR_FSEBehaviorMode' -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $key -Name 'GameDVR_DXGIHonorFSEWindowsCompatible' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $key -Name 'GameDVR_HonorUserFSEBehaviorMode' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $key -Name 'GameDVR_EFSEFeatureFlags' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path $key -Name 'GameDVR_FSEBehavior' -Force -ErrorAction SilentlyContinue
        } catch {}
      }
      $hives = @('Registry::HKEY_USERS\.DEFAULT')
      if (Test-Path 'Registry::HKEY_USERS\AME_UserHive_Default') { $hives += 'Registry::HKEY_USERS\AME_UserHive_Default' }
      Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object {
        $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$'
      } | ForEach-Object { $hives += ('Registry::HKEY_USERS\' + $_.PSChildName) }
      foreach ($h in $hives) { Set-FsoStock -HiveRoot $h }
      $ntu = Join-Path $env:SystemDrive 'Users\Default\NTUSER.DAT'
      if ((Test-Path $ntu) -and -not (Test-Path 'Registry::HKEY_USERS\AME_UserHive_Default')) {
        & reg.exe load 'HKU\EBOS_FSO_Default' $ntu 2>&1 | Out-Null
        if ($LASTEXITCODE -eq 0) {
          Set-FsoStock -HiveRoot 'Registry::HKEY_USERS\EBOS_FSO_Default'
          [gc]::Collect(); Start-Sleep -Milliseconds 300
          & reg.exe unload 'HKU\EBOS_FSO_Default' 2>&1 | Out-Null
        }
      }
      $global:LASTEXITCODE = 0

  - !writeStatus: {status: "Restoring Audio Enhancements"}
  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      # R11 disabled audio enhancements on every endpoint, automatically and with no
      # way to find or undo it. That is reverted here rather than repeated.
      #
      # Upgrade-only, keyed on the EBOS stamp phase7 writes at the end of a previous
      # run: a fresh install never had the value set by us, so there is nothing to undo
      # and a delete there would only clobber a choice the user made themselves.
      #
      # {1da5d803-d492-4edd-8c23-e0c0ffee7f0e},5 is PKEY_AudioEndpoint_Disable_SysFx.
      # Deleted, not set to 0: absent is stock, 0 is "explicitly enabled".
      $fresh = $true
      try {
        $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\EBOS\EBOS')
        if ($null -eq $k) { $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\EBOS\EBOS-X') }
        if ($null -ne $k) {
          if ($k.GetValue('Installed') -eq 1) { $fresh = $false }
          $k.Close()
        }
      } catch {}

      if (-not $fresh) {
        $prop = '{1da5d803-d492-4edd-8c23-e0c0ffee7f0e},5'
        $report = @()
        foreach ($root in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Capture')) {
          if (-not (Test-Path $root)) { continue }
          foreach ($k in (Get-ChildItem -Path $root -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -eq 'FxProperties' })) {
            try {
              $cur = (Get-ItemProperty -Path $k.PSPath -Name $prop -ErrorAction SilentlyContinue).$prop
              if ($null -eq $cur -or [int]$cur -ne 1) { continue }

              # Endpoint id and friendly name, so this is never blind again.
              $endpoint = Split-Path (Split-Path $k.PSPath -Parent) -Leaf
              $name = ''
              try {
                $devKey = Split-Path $k.PSPath -Parent
                $props = Join-Path $devKey 'Properties'
                $name = [string](Get-ItemProperty -Path $props -Name '{a45c254e-df1c-4efd-8020-67d146a850e0},2' -ErrorAction SilentlyContinue).'{a45c254e-df1c-4efd-8020-67d146a850e0},2'
              } catch {}

              Remove-ItemProperty -Path $k.PSPath -Name $prop -Force -ErrorAction SilentlyContinue
              $still = (Get-ItemProperty -Path $k.PSPath -Name $prop -ErrorAction SilentlyContinue).$prop
              $report += ('    ' + $endpoint + '  name=' + $(if ($name) { $name } else { '(unknown)' }) + '  reverted=' + [string]($null -eq $still))
            } catch {}
          }
        }
        try {
          $dir = Join-Path $env:windir 'EBOS'
          if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
          $rep = @((Get-Date -Format s) + ' - audio enhancements RESTORED to Windows default (upgrade)')
          if ($report.Count -gt 0) { $rep += $report } else { $rep += '    no endpoint had enhancements disabled by EBOS' }
          $rep | Out-File -FilePath (Join-Path $dir 'audio-enhancements.txt') -Append -Encoding utf8
        } catch {}
      }
      $global:LASTEXITCODE = 0


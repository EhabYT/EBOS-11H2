  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion', value: 'EditionSubstring', type: REG_SZ, data: 'EBOS'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion', value: 'EditionSubVersion', type: REG_SZ, data: 'EBOS'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'Manufacturer', type: REG_SZ, data: 'EBOS'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'SupportURL', type: REG_SZ, data: 'https://discord.gg/9cHp2Jwq4b'}
  - !powerShell:
    command: |
      $label = 'EBOS'
      try {
        $installEpoch = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' -Name 'InstallDate' -ErrorAction SilentlyContinue).InstallDate
        if ($installEpoch) {
          $installUtc = [System.DateTimeOffset]::FromUnixTimeSeconds([System.Int64]$installEpoch).UtcDateTime
          $ageHours = ((Get-Date).ToUniversalTime() - $installUtc).TotalHours
          # EBOS: the 40-hour "EXP" relabel is disabled on purpose - the FreshInstall
          # gate was lifted, so an aged install must not be branded differently.
        }
      } catch {}
      bcdedit /set description "$label"
      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation' -Name 'Model' -Value $label
      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' -Name 'RegisteredOrganization' -Value $label
      $global:LASTEXITCODE = 0
    wait: true
  - !registryValue: {path: 'HKCU\Environment', value: 'DOTNET_CLI_TELEMETRY_OPTOUT', type: REG_SZ, data: '1'}
  - !registryValue: {path: 'HKU\.DEFAULT\Environment', value: 'DOTNET_CLI_TELEMETRY_OPTOUT', type: REG_SZ, data: '1'}
  - !registryValue: {path: 'HKCU\Environment', value: 'POWERSHELL_TELEMETRY_OPTOUT', type: REG_SZ, data: '1'}
  - !registryValue: {path: 'HKU\.DEFAULT\Environment', value: 'POWERSHELL_TELEMETRY_OPTOUT', type: REG_SZ, data: '1'}
  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      try { Set-Service -Name 'WSearch' -StartupType Automatic -ErrorAction SilentlyContinue } catch {}
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\WSearch' -Name 'Start' -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue
      Remove-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\WSearch' -Name 'DelayedAutostart' -Force -ErrorAction SilentlyContinue
      $global:LASTEXITCODE = 0
  - !cmd: {command: 'fsutil behavior set disableLastAccess 1'}
  - !cmd: {command: 'fsutil behavior set disable8dot3 1'}
  - !cmd: {command: 'net accounts /maxpwage:unlimited'}
  - !powerShell: {command: 'Disable-WindowsErrorReporting'}
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -EP Bypass -File .\\setup-timerresolution.ps1'

  # Ungated on purpose: anyone carrying a broken WdBoot state from an earlier build
  # needs this whether or not they tick Defender removal this time. The script's own
  # first action is to check whether Defender is still present and do nothing if so,
  # so a healthy machine is never touched.
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -EP Bypass -File .\\fix-wdboot.ps1'
    weight: 100
    wait: true
  - !writeStatus: {status: "Setting Max Refresh Rate"}
  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $csLines = @(
        'using System;',
        'using System.Runtime.InteropServices;',
        'public static class EbosDisplay {',
        '[StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]',
        'public struct DEVMODE {',
        '[MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;',
        'public ushort dmSpecVersion; public ushort dmDriverVersion; public ushort dmSize;',
        'public ushort dmDriverExtra; public uint dmFields;',
        'public int dmPositionX; public int dmPositionY;',
        'public uint dmDisplayOrientation; public uint dmDisplayFixedOutput;',
        'public short dmColor; public short dmDuplex; public short dmYResolution;',
        'public short dmTTOption; public short dmCollate;',
        '[MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;',
        'public ushort dmLogPixels; public uint dmBitsPerPel;',
        'public uint dmPelsWidth; public uint dmPelsHeight;',
        'public uint dmDisplayFlags; public uint dmDisplayFrequency;',
        'public uint dmICMMethod; public uint dmICMIntent; public uint dmMediaType;',
        'public uint dmDitherType; public uint dmReserved1; public uint dmReserved2;',
        'public uint dmPanningWidth; public uint dmPanningHeight;',
        '}',
        '[StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]',
        'public struct DISPLAY_DEVICE {',
        'public int cb;',
        '[MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string DeviceName;',
        '[MarshalAs(UnmanagedType.ByValTStr, SizeConst = 128)] public string DeviceString;',
        'public uint StateFlags;',
        '[MarshalAs(UnmanagedType.ByValTStr, SizeConst = 128)] public string DeviceID;',
        '[MarshalAs(UnmanagedType.ByValTStr, SizeConst = 128)] public string DeviceKey;',
        '}',
        '[DllImport(@Q@user32.dll@Q@, CharSet = CharSet.Unicode)]',
        'public static extern bool EnumDisplayDevices(string lpDevice, uint iDevNum, ref DISPLAY_DEVICE lpDisplayDevice, uint dwFlags);',
        '[DllImport(@Q@user32.dll@Q@, CharSet = CharSet.Unicode)]',
        'public static extern bool EnumDisplaySettings(string lpszDeviceName, int iModeNum, ref DEVMODE lpDevMode);',
        '[DllImport(@Q@user32.dll@Q@, CharSet = CharSet.Unicode)]',
        'public static extern int ChangeDisplaySettingsEx(string lpszDeviceName, ref DEVMODE lpDevMode, IntPtr hwnd, uint dwflags, IntPtr lParam);',
        '}'
      )
      $src = ($csLines -join [System.Environment]::NewLine).Replace('@Q@', [string][char]34)
      try { Add-Type -TypeDefinition $src -ErrorAction Stop } catch { $global:LASTEXITCODE = 0; return }

      $ENUM_CURRENT = -1
      $ATTACHED = 1
      $UPDATEREGISTRY = 1
      $GLOBAL = 8
      $lines = @()

      for ($i = 0; $i -lt 16; $i++) {
        $dd = New-Object EbosDisplay+DISPLAY_DEVICE
        $dd.cb = [System.Runtime.InteropServices.Marshal]::SizeOf($dd)
        if (-not [EbosDisplay]::EnumDisplayDevices($null, $i, [ref]$dd, 0)) { break }
        if (($dd.StateFlags -band $ATTACHED) -eq 0) { continue }
        $name = $dd.DeviceName

        $cur = New-Object EbosDisplay+DEVMODE
        $cur.dmSize = [uint16][System.Runtime.InteropServices.Marshal]::SizeOf($cur)
        if (-not [EbosDisplay]::EnumDisplaySettings($name, $ENUM_CURRENT, [ref]$cur)) { continue }

        $best = $cur
        $m = 0
        while ($true) {
          $test = New-Object EbosDisplay+DEVMODE
          $test.dmSize = [uint16][System.Runtime.InteropServices.Marshal]::SizeOf($test)
          if (-not [EbosDisplay]::EnumDisplaySettings($name, $m, [ref]$test)) { break }
          $m++
          if ($test.dmPelsWidth -ne $cur.dmPelsWidth) { continue }
          if ($test.dmPelsHeight -ne $cur.dmPelsHeight) { continue }
          if ($test.dmBitsPerPel -ne $cur.dmBitsPerPel) { continue }
          if ($test.dmDisplayFrequency -gt $best.dmDisplayFrequency) { $best = $test }
        }

        if ($best.dmDisplayFrequency -gt $cur.dmDisplayFrequency) {
          $rc = [EbosDisplay]::ChangeDisplaySettingsEx($name, [ref]$best, [IntPtr]::Zero, ($UPDATEREGISTRY -bor $GLOBAL), [IntPtr]::Zero)
          $lines += ($name + ' ' + $cur.dmDisplayFrequency + 'Hz to ' + $best.dmDisplayFrequency + 'Hz rc=' + $rc)
        } else {
          $lines += ($name + ' already at ' + $cur.dmDisplayFrequency + 'Hz')
        }
      }

      try {
        $dir = Join-Path $env:windir 'EBOS'
        if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
        # $lines is empty when no monitor reported a higher mode than it was already
        # using, which produced a bare timestamp and a dangling dash.
        $body = if ($lines -and $lines.Count -gt 0) { $lines -join '; ' } else { 'no monitor needed a change' }
        ((Get-Date -Format s) + ' - ' + $body) | Out-File -FilePath (Join-Path $dir 'refresh-rate.txt') -Append -Encoding utf8
      } catch {}
      $global:LASTEXITCODE = 0
  # gpupdate contacts a domain controller when the machine is joined, and on one
  # with a stale or unreachable DC it can block for a very long time. A native
  # !run has no timeout, so it is bounded here. Nothing depends on it finishing -
  # the policies are already written to the registry above.
  - !powerShell:
      wait: true
      errorAction: Ignore
      command: |
        try {
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = [System.IO.Path]::Combine($env:windir, 'System32', 'gpupdate.exe')
          $psi.Arguments = '/target:computer'
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          if (-not $proc.WaitForExit(120000)) {
            try { $proc.Kill() } catch {}
            $dir = Join-Path $env:windir 'EBOS'
            if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
            @((Get-Date -Format s) + ' - gpupdate timed out after 2 min and was killed') | Out-File -FilePath (Join-Path $dir 'skipped-tasks.txt') -Append -Encoding utf8
          }
        } catch {}
        $global:LASTEXITCODE = 0

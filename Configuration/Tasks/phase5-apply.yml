  # --- personalization guard (Windows 11 26H2 regression) -----------
  # KB5120998 and later reset cursor personalization and blank the
  # wallpaper. Re-apply both at every logon instead of only at install.
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Ignore
    command: |
      $dir = Join-Path $env:ProgramData 'EBOS'
      New-Item -ItemType Directory -Path $dir -Force -ErrorAction SilentlyContinue | Out-Null
      # This folder holds a script run at EVERY logon with -ExecutionPolicy
      # Bypass. Leaving it on inherited ProgramData permissions would mean a
      # standard user who can write here gets code execution at each sign-in.
      # Addressed by SID, not by name: "Users" is "Benutzer" on a German
      # install and a name-based rule would silently fail to apply.
      try {
        $acl = Get-Acl -LiteralPath $dir
        $acl.SetAccessRuleProtection($true, $false)
        foreach ($r in @($acl.Access)) { [void]$acl.RemoveAccessRule($r) }
        foreach ($sid in @('S-1-5-18','S-1-5-32-544')) {
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule(
            (New-Object System.Security.Principal.SecurityIdentifier($sid)),
            'FullControl','ContainerInherit,ObjectInherit','None','Allow')))
        }
        $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule(
          (New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')),
          'ReadAndExecute','ContainerInherit,ObjectInherit','None','Allow')))
        Set-Acl -LiteralPath $dir -AclObject $acl
      } catch {}
      $src = Join-Path $PWD 'restore-personalization.ps1'
      $dst = Join-Path $dir 'restore-personalization.ps1'
      if (Test-Path -LiteralPath $src) {
        Copy-Item -LiteralPath $src -Destination $dst -Force -ErrorAction SilentlyContinue
      }
      if (Test-Path -LiteralPath $dst) {
        try {
          $arg = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "' + $dst + '"'
          $act = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument $arg
          $trg = New-ScheduledTaskTrigger -AtLogOn
          # S-1-5-32-545 = Users, so it runs in the logging-on user session;
          # SystemParametersInfo only affects the session that calls it.
          $pri = New-ScheduledTaskPrincipal -GroupId 'S-1-5-32-545' -RunLevel Limited
          $set = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 5)
          Register-ScheduledTask -TaskName 'EBOS Personalization Guard' -Action $act -Trigger $trg -Principal $pri -Settings $set -Force -ErrorAction SilentlyContinue | Out-Null
        } catch {}
      }
      $global:LASTEXITCODE = 0


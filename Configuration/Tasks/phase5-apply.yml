  - !powerShell:
    option: "fs-small-icons"
    wait: true
    errorAction: Ignore
    command: |
      # Small desktop icons. The desktop's view state lives in the Shell
      # Bags under Bags\1\Desktop. Writing it into a live profile does not
      # stick, because the running desktop rewrites its in-memory state
      # over ours on logoff. This runs before any real profile exists, so
      # it seeds the Default hive that every new user is created from,
      # which is how NTLite makes the same change survive. The final
      # reboot at the end of the playbook does the applying; no Explorer
      # restart is needed here.
      #
      #   IconSize        0x20 (32) = small       (0x10 smallest .. 0x100 largest)
      #   Mode            1         = icon view
      #   LogicalViewMode 3         = the value the shell writes for icons
      function Set-SmallDesktopIcons {
        param([string]$BagsRoot)
        $desktop = Join-Path $BagsRoot 'Bags\1\Desktop'
        try {
          New-Item -Path $desktop -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path $desktop -Name 'IconSize'        -Value 32 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $desktop -Name 'Mode'            -Value 1  -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $desktop -Name 'LogicalViewMode' -Value 3  -Type DWord -Force -ErrorAction SilentlyContinue
          # A stale ViewState2 overrides the values above, so clear it.
          Remove-ItemProperty -Path $desktop -Name 'ViewState2' -Force -ErrorAction SilentlyContinue
        } catch {}
      }

      # Seed the AME-provided default hive if present.
      if (Test-Path 'Registry::HKEY_USERS\AME_UserHive_Default') {
        Set-SmallDesktopIcons 'Registry::HKEY_USERS\AME_UserHive_Default\Software\Microsoft\Windows\Shell'
      }

      # And the on-disk Default profile template, loaded explicitly, so a
      # profile created after this playbook also inherits small icons.
      $ntu = 'C:\Users\Default\NTUSER.DAT'
      if ((Test-Path $ntu) -and -not (Test-Path 'Registry::HKEY_USERS\AME_UserHive_Default')) {
        reg load 'HKLM\EBOS_SI' $ntu 2>$null | Out-Null
        Set-SmallDesktopIcons 'HKLM:\EBOS_SI\Software\Microsoft\Windows\Shell'
        [gc]::Collect(); Start-Sleep -Milliseconds 300
        reg unload 'HKLM\EBOS_SI' 2>$null | Out-Null
      }
      $global:LASTEXITCODE = 0


---
privilege: TrustedInstaller
actions:
  - !writeStatus: {status: "Configuring Shell"}

  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Ignore
    command: |
      # The triple-quote form reached PowerShell literally, so the destination was a
      # path wrapped in quote characters. Join-Path with plain single quotes has no
      # such ambiguity and survives AME's parser unchanged.
      $ebosDir = Join-Path $env:windir 'EBOS'
      New-Item -ItemType Directory -Path $ebosDir -Force -ErrorAction SilentlyContinue | Out-Null
      $notes = New-Object System.Collections.ArrayList
      foreach ($ico in @('ebos.ico','discord.ico')) {
        $src = Join-Path $PWD $ico
        $dst = Join-Path $ebosDir $ico
        if (Test-Path $src) {
          try { Copy-Item -Path $src -Destination $dst -Force -ErrorAction Stop } catch {}
        }
        if (Test-Path $dst) { [void]$notes.Add('  icon ok: ' + $dst + '  ' + (Get-Item $dst).Length + ' bytes') }
        else { [void]$notes.Add('  ICON MISSING: ' + $dst) }
      }
      # The shortcuts point at these icons, so a standard user has to be able to read
      # them or the desktop shows a blank tile. Granted explicitly rather than relying
      # on whatever the folder inherited while running as TrustedInstaller.
      try { & icacls $ebosDir /grant '*S-1-5-32-545:(OI)(CI)RX' /T /C | Out-Null } catch {}
      $publicDesktop = Join-Path $env:PUBLIC 'Desktop'
      New-Item -ItemType Directory -Path $publicDesktop -Force -ErrorAction SilentlyContinue | Out-Null
      $dcIcon = Join-Path $ebosDir 'discord.ico'
      # .lnk, not .url: Windows 10 does not render a custom IconFile on an InternetShortcut
      # (.url) - the tile came up blank - while a .lnk with an explicit IconLocation renders
      # on both 10 and 11. explorer.exe is the target with the URL as its argument, so a
      # double-click hands the address to the default browser via ShellExecute.
      $explorer = Join-Path $env:windir 'explorer.exe'
      $shortcuts = @(
        @{ n = 'EBOS Discord.lnk';         url = 'https://discord.gg/9cHp2Jwq4b';     ico = $dcIcon; desc = 'EBOS Discord' }
      )
      $fresh = $true
      try {
        $stampKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\EBOS\EBOS')
        if (-not $stampKey) { $stampKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\EBOS\EBOS-X') }
        if ($stampKey) {
          if ($stampKey.GetValue('Installed') -eq 1) { $fresh = $false }
          $stampKey.Close()
        }
      } catch {}
      if ($fresh) {
        $wsh = New-Object -ComObject WScript.Shell
        foreach ($s in $shortcuts) {
          $t = Join-Path $publicDesktop $s.n
          # Remove any stale .url of the same name from an earlier build so the desktop
          # does not end up carrying both.
          $oldUrl = Join-Path $publicDesktop ([System.IO.Path]::ChangeExtension($s.n, '.url'))
          if (Test-Path $oldUrl) { Remove-Item -Path $oldUrl -Force -ErrorAction SilentlyContinue }
          if (Test-Path $t) { Remove-Item -Path $t -Force -ErrorAction SilentlyContinue }
          try {
            $sc = $wsh.CreateShortcut($t)
            $sc.TargetPath = $explorer
            $sc.Arguments = $s.url
            $sc.IconLocation = $s.ico + ',0'
            $sc.Description = $s.desc
            $sc.Save()
          } catch {}
          if (Test-Path $t) { [void]$notes.Add('  shortcut ok: ' + $t + '  ' + (Get-Item $t).Length + ' bytes') }
          else { [void]$notes.Add('  SHORTCUT MISSING: ' + $t) }
        }
      } else {
        [void]$notes.Add('  upgrade detected - desktop shortcuts not re-added')
      }
      try {
        $o = @((Get-Date -Format s) + ' - desktop shortcuts')
        $o += $notes
        $o | Out-File -FilePath (Join-Path $ebosDir 'desktop-shortcuts.txt') -Append -Encoding utf8
      } catch {}
      $global:LASTEXITCODE = 0

  - !powerShell:
    option: "fs-wallpaper"
    exeDir: true
    wait: true
    errorAction: Ignore
    command: |
      $dest = Join-Path $env:windir 'Web\Wallpaper\EBOS'
      New-Item -ItemType Directory -Path $dest -Force -ErrorAction SilentlyContinue | Out-Null
      $wp = Join-Path $PWD 'wallpaper.png'
      $ls = Join-Path $PWD 'lockscreen.png'
      if (Test-Path $wp) { Copy-Item -Path $wp -Destination (Join-Path $dest 'wallpaper.png') -Force -ErrorAction SilentlyContinue }
      if (Test-Path $ls) { Copy-Item -Path $ls -Destination (Join-Path $dest 'lockscreen.png') -Force -ErrorAction SilentlyContinue }
      $global:LASTEXITCODE = 0


  # --- EBOS cursor scheme ------------------------------------------
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Ignore
    command: |
      $dest = Join-Path $env:windir 'Cursors\EBOS'
      New-Item -ItemType Directory -Path $dest -Force -ErrorAction SilentlyContinue | Out-Null
      $src = Join-Path $PWD 'cursors'
      if (Test-Path $src) {
        Copy-Item -Path (Join-Path $src '*') -Destination $dest -Recurse -Force -ErrorAction SilentlyContinue
      }
      # Legacy cursor names left by older builds: ebos-*-fire-hq-256.ani (oldest),
      # ebos-*-fire-hq.ani and ebos-*-hq.ani (r11 previews). This build ships
      # ebos-*.ani, so once the full new set is on disk (17 files - any legacy
      # name containing 'hq' is excluded from the count because the new names
      # never contain it), drop the orphaned old sets so a failed copy can never
      # leave the folder empty.
      $fresh = @(Get-ChildItem -LiteralPath $dest -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'ebos-*.ani' -and $_.Name -notlike '*hq*' }).Count
      if ($fresh -ge 17) {
        Get-ChildItem -LiteralPath $dest -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'ebos-*-hq*' } | Remove-Item -Force -ErrorAction SilentlyContinue
      }
      $map = @{'Arrow'='ebos-arrow.ani';'Help'='ebos-help.ani';'AppStarting'='ebos-appstarting.ani';'Wait'='ebos-wait.ani';'Crosshair'='ebos-cross.ani';'IBeam'='ebos-ibeam.ani';'NWPen'='ebos-pen.ani';'No'='ebos-no.ani';'SizeNS'='ebos-sizens.ani';'SizeWE'='ebos-sizewe.ani';'SizeNWSE'='ebos-sizenwse.ani';'SizeNESW'='ebos-sizenesw.ani';'SizeAll'='ebos-sizeall.ani';'UpArrow'='ebos-up.ani';'Hand'='ebos-hand.ani';'Pin'='ebos-pin.ani';'Person'='ebos-person.ani'}
      $order = @('Arrow','Help','AppStarting','Wait','Crosshair','IBeam','NWPen','No','SizeNS','SizeWE','SizeNWSE','SizeNESW','SizeAll','UpArrow','Hand','Pin','Person')
      $scheme = ($order | ForEach-Object { '%SystemRoot%\Cursors\EBOS\' + $map[$_] }) -join ','
      $hives = @('Registry::HKU\.DEFAULT')
      Get-ChildItem 'Registry::HKU' | Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notlike '*_Classes' } | ForEach-Object {
        $hives += 'Registry::' + $_.Name
      }
      foreach ($h in $hives) {
        $ck = Join-Path $h 'Control Panel\Cursors'
        $sk = Join-Path $ck 'Schemes'
        New-Item -Path $ck -Force -ErrorAction SilentlyContinue | Out-Null
        New-Item -Path $sk -Force -ErrorAction SilentlyContinue | Out-Null
        foreach ($role in $order) {
          try { Set-ItemProperty -Path $ck -Name $role -Value ('%SystemRoot%\Cursors\EBOS\' + $map[$role]) -Type ExpandString -Force -ErrorAction SilentlyContinue } catch {}
        }
        try { Set-ItemProperty -Path $ck -Name '(Default)' -Value 'EBOS' -Type String -Force -ErrorAction SilentlyContinue } catch {}
        try { Set-ItemProperty -Path $ck -Name 'Scheme Source' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue } catch {}
        # Pin the rendered size. Windows keeps CursorBaseSize from whatever
        # scheme was installed before; the playbook never set it, so an
        # inherited value made these cursors appear at the wrong size even
        # though the files are correct. 32 is the Windows default, and the
        # .cur files carry 32/48/64/96/128 so any DPI gets a crisp frame.
        try { Set-ItemProperty -Path $ck -Name 'CursorBaseSize' -Value 32 -Type DWord -Force -ErrorAction SilentlyContinue } catch {}
        try { Set-ItemProperty -Path $sk -Name 'EBOS' -Value $scheme -Type ExpandString -Force -ErrorAction SilentlyContinue } catch {}
      }
      $sig = '[DllImport("user32.dll", SetLastError=true)] public static extern bool SystemParametersInfo(uint a, uint b, IntPtr c, uint d);'
      try {
        $t = Add-Type -MemberDefinition $sig -Name 'EbosCur' -Namespace 'Ebos' -PassThru -ErrorAction SilentlyContinue
        [void]$t::SystemParametersInfo(0x0057, 0, [IntPtr]::Zero, 0x02)
      } catch {}
      $global:LASTEXITCODE = 0

  - !registryValue: {path: 'HKU\.DEFAULT\Control Panel\Desktop', value: 'JPEGImportQuality', type: REG_DWORD, data: '100'}
  - !powerShell:
      wait: true
      errorAction: Ignore
      command: |
        Get-ChildItem 'Registry::HKU' | Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notlike '*_Classes' } | ForEach-Object {
          $k = 'Registry::' + $_.Name + '\Control Panel\Desktop'
          if (Test-Path $k) {
            try { Set-ItemProperty -Path $k -Name 'JPEGImportQuality' -Value 100 -Type DWord -Force -ErrorAction SilentlyContinue } catch {}
          }
        }
        $global:LASTEXITCODE = 0
  - !powerShell:
    option: "fs-wallpaper"
    wait: true
    errorAction: Ignore
    command: |
      $deskKey = 'Registry::HKU\.DEFAULT\Control Panel\Desktop'
      New-Item -Path $deskKey -Force -ErrorAction SilentlyContinue | Out-Null
      Set-ItemProperty -Path $deskKey -Name 'Wallpaper' -Value '%SystemRoot%\Web\Wallpaper\EBOS\wallpaper.png' -Type String -Force -ErrorAction SilentlyContinue
      Set-ItemProperty -Path $deskKey -Name 'WallpaperStyle' -Value '10' -Type String -Force -ErrorAction SilentlyContinue
      Set-ItemProperty -Path $deskKey -Name 'TileWallpaper' -Value '0' -Type String -Force -ErrorAction SilentlyContinue
      $persKey = 'Registry::HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization'
      New-Item -Path $persKey -Force -ErrorAction SilentlyContinue | Out-Null
      Set-ItemProperty -Path $persKey -Name 'LockScreenImagePath' -Value '%SystemRoot%\Web\Wallpaper\EBOS\lockscreen.png' -Type String -Force -ErrorAction SilentlyContinue
      Set-ItemProperty -Path $persKey -Name 'LockScreenImageUrl' -Value '%SystemRoot%\Web\Wallpaper\EBOS\lockscreen.png' -Type String -Force -ErrorAction SilentlyContinue
      $global:LASTEXITCODE = 0

  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $marker = Join-Path $env:windir 'EBOS\.personalization-applied'
      if (Test-Path $marker) { $global:LASTEXITCODE = 0; return }
      $opts = @()
      $optsFile = Join-Path $env:windir 'EBOS\ebos-options.txt'
      if (Test-Path $optsFile) { $opts = Get-Content $optsFile -ErrorAction SilentlyContinue }
      $userHives = @('Registry::HKU\.DEFAULT')
      if (Test-Path 'Registry::HKEY_USERS\AME_UserHive_Default') { $userHives += 'Registry::HKEY_USERS\AME_UserHive_Default' }
      Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } | ForEach-Object { $userHives += ('Registry::HKEY_USERS\' + $_.PSChildName) }
      $pinPaths = @()
      foreach ($h in $userHives) { $pinPaths += ($h + '\Software\Microsoft\Windows\CurrentVersion\Explorer\Taskband\AuxilliaryPins') }
      foreach ($p in $pinPaths) {
        if (-not (Test-Path $p)) { New-Item -Path $p -Force -ErrorAction SilentlyContinue | Out-Null }
      }
      $bothHives = @(
        'TaskViewPin','OutlookWebPin','WidgetsPin','ChatPin','MailPin','OutlookPin','CopilotPin'
      )
      $hkcuOnly = @(
        'CopilotPWAPin','LinkedInPin','DevHomePin','NotepadPin','PhotosPin','GetStartedPin','SettingsPin','SnippingToolPin'
      )
      foreach ($p in $pinPaths) {
        foreach ($n in ($bothHives + $hkcuOnly)) {
          Set-ItemProperty -Path $p -Name $n -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        }
      }
      if ($opts -contains 'remove-xbox') {
        foreach ($p in $pinPaths) { Set-ItemProperty -Path $p -Name 'XboxPin' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue }
      }
      if ($opts -contains 'remove-store') {
        foreach ($p in $pinPaths) { Set-ItemProperty -Path $p -Name 'StorePin' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue }
      }
      if ($opts -contains 'remove-edge') {
        foreach ($p in $pinPaths) { Set-ItemProperty -Path $p -Name 'EdgePin' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue }
      }
      $global:LASTEXITCODE = 0

  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\ImmersiveShell', value: 'SignInMode', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Device', value: 'DevicePasswordLessBuildVersion', type: REG_DWORD, data: '2'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\ImmersiveShell', value: 'TabletMode', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer', value: 'DisableEdgeDesktopShortcutCreation', type: REG_DWORD, data: '1', option: "remove-edge"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer', value: 'ShowRecommendations', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer', value: 'EnablePrelaunch', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\Maintenance', value: 'MaintenanceDisabled', type: REG_DWORD, data: '1'}

  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Start_ShowFrequentList', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\System\GameConfigStore', value: 'GameDVR_Enabled', type: REG_DWORD, data: '0', option: "remove-xbox"}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\GameDVR', value: 'AppCaptureEnabled', type: REG_DWORD, data: '0', option: "remove-xbox"}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Start_AccountNotifications', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'EnableSnapAssistFlyoutOnHover', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'EnableSnapAssistFlyout', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SmartActionPlatform\ActionManager\Installed\System.DescribeImage', value: 'Enabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\TabletTip\1.7', value: 'EnableAutocorrection', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Start_ShowRecentList', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'SnapAssist', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'MultiTaskingAltTabFilter', type: REG_DWORD, data: '3'}
  - !registryValue: {path: 'HKCU\Control Panel\UnsupportedHardwareNotificationCache', value: 'SV2', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'SnapFill', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\PushNotifications', value: 'ToastEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\GameBar', value: 'UseNexusForGameBarEnabled', type: REG_DWORD, data: '0', option: "remove-xbox"}
  - !registryValue: {path: 'HKCU\Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\Bags\AllFolders\Shell', value: 'FolderType', type: REG_SZ, data: 'NotSpecified'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'EnableSnapBar', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\TabletTip\1.7', value: 'EnableSpellchecking', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'JointResize', type: REG_DWORD, data: '0'}

  - !powerShell:
    option: "fs-darkmode"
    wait: true
    errorAction: Ignore
    command: |
      $marker = Join-Path $env:windir 'EBOS\.personalization-applied'
      if (Test-Path $marker) { $global:LASTEXITCODE = 0; return }
      $userHives = @('Registry::HKU\.DEFAULT')
      if (Test-Path 'Registry::HKEY_USERS\AME_UserHive_Default') { $userHives += 'Registry::HKEY_USERS\AME_UserHive_Default' }
      Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } | ForEach-Object { $userHives += ('Registry::HKEY_USERS\' + $_.PSChildName) }
      $themePaths = @()
      foreach ($h in $userHives) { $themePaths += ($h + '\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize') }
      foreach ($p in $themePaths) {
        if (-not (Test-Path $p)) { New-Item -Path $p -Force -ErrorAction SilentlyContinue | Out-Null }
        Set-ItemProperty -Path $p -Name 'SystemUsesLightTheme' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $p -Name 'AppsUseLightTheme' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $p -Name 'ColorPrevalence' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
      }
      $global:LASTEXITCODE = 0

  - !powerShell:
      option: "fs-darkmode"
      exeDir: true
      wait: true
      errorAction: Ignore
      command: '.\apply-darkmode.ps1'

  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $marker = Join-Path $env:windir 'EBOS\.personalization-applied'
      if (Test-Path $marker) { $global:LASTEXITCODE = 0; return }
      $sids = @('.DEFAULT')
      try {
        $sids += (Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue |
          Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } |
          ForEach-Object { $_.PSChildName })
      } catch {}
      foreach ($sid in $sids) {
        $key = 'Registry::HKEY_USERS\' + $sid + '\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
        if (-not (Test-Path $key)) { New-Item -Path $key -Force -ErrorAction SilentlyContinue | Out-Null }
        Set-ItemProperty -Path $key -Name 'EnableTransparency' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
      }
      $global:LASTEXITCODE = 0

  - !powerShell:
    option: "fs-notransparency"
    wait: true
    errorAction: Ignore
    command: |
      $sids = @('.DEFAULT')
      try {
        $sids += (Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue |
          Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } |
          ForEach-Object { $_.PSChildName })
      } catch {}
      foreach ($sid in $sids) {
        $key = 'Registry::HKEY_USERS\' + $sid + '\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
        if (-not (Test-Path $key)) { New-Item -Path $key -Force -ErrorAction SilentlyContinue | Out-Null }
        Set-ItemProperty -Path $key -Name 'EnableTransparency' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
      }
      $global:LASTEXITCODE = 0

  - !powerShell:
    option: "fs-wallpaper"
    command: '.\\set-wallpaper.ps1 -Mode Desktop -ImagePath $env:systemroot\Web\Wallpaper\EBOS\wallpaper.png'
    exeDir: true
    runas: currentUserElevated
    wait: true
    weight: 40
  - !powerShell:
    option: "fs-wallpaper"
    command: '.\\set-wallpaper.ps1 -Mode LockScreen -ImagePath $env:systemroot\Web\Wallpaper\EBOS\lockscreen.png'
    exeDir: true
    runas: currentUserElevated
    wait: true
    weight: 40

  - !registryValue: {path: 'HKLM\SOFTWARE\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32', value: '', type: REG_SZ, data: '', option: "fs-w10-context"}
  - !registryValue: {path: 'HKCU\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32', value: '', type: REG_SZ, data: '', option: "fs-w10-context"}

  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $marker = Join-Path $env:windir 'EBOS\.personalization-applied'
      if (Test-Path $marker) { $global:LASTEXITCODE = 0; return }
      $ifeoRoot = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options'
      foreach ($exe in @('StartMenuExperienceHost.exe','SearchHost.exe')) {
        $p = Join-Path $ifeoRoot $exe
        if (-not (Test-Path $p)) { New-Item -Path $p -Force -ErrorAction SilentlyContinue | Out-Null }
        Set-ItemProperty -Path $p -Name 'Debugger' -Value '%SystemRoot%\System32\taskkill.exe' -Type String -Force -ErrorAction SilentlyContinue
      }
      Get-Process -Name 'StartMenuExperienceHost' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      Get-Process -Name 'SearchHost' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      Start-Sleep -Milliseconds 600
      foreach ($exe in @('StartMenuExperienceHost.exe','SearchHost.exe')) {
        $p = Join-Path $ifeoRoot $exe
        Remove-ItemProperty -Path $p -Name 'Debugger' -Force -ErrorAction SilentlyContinue
        Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
      }
      $global:LASTEXITCODE = 0
  - !appx: {operation: clearCache, name: '*MicrosoftWindows.Client.CBS*'}

  - !writeStatus: {status: "Cleaning Start and Taskbar"}

  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $marker = Join-Path $env:windir 'EBOS\.personalization-applied'
      if (Test-Path $marker) { $global:LASTEXITCODE = 0; return }
      Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\StuckRects3' -Name 'Settings' -Force -ErrorAction SilentlyContinue
      Remove-ItemProperty -Path 'Registry::HKU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\StuckRects3' -Name 'Settings' -Force -ErrorAction SilentlyContinue
      $advRoots = @('Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced')
      if (Test-Path 'Registry::HKEY_USERS\AME_UserHive_Default') { $advRoots += 'Registry::HKEY_USERS\AME_UserHive_Default\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' }
      Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } | ForEach-Object { $advRoots += ('Registry::HKEY_USERS\' + $_.PSChildName + '\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced') }
      foreach ($p in $advRoots) {
        if (-not (Test-Path $p)) { New-Item -Path $p -Force -ErrorAction SilentlyContinue | Out-Null }
        Set-ItemProperty -Path $p -Name 'ShowTaskViewButton' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $p -Name 'Start_TrackDocs' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $p -Name 'Start_IrisRecommendations' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $p -Name 'Start_TrackProgs' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $p -Name 'Start_Layout' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
      }
      $polExp = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      if (-not (Test-Path $polExp)) { New-Item -Path $polExp -Force -ErrorAction SilentlyContinue | Out-Null }
      Set-ItemProperty -Path $polExp -Name 'HideTaskViewButton' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue

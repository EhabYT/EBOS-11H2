  - !writeStatus: {status: "Finalizing Setup", option: "fs-privacy"}



  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SystemSettings\AccountNotifications', value: 'EnableAccountNotifications', type: REG_DWORD, data: '0', option: "fs-privacy"}
  - !registryValue: {path: 'HKU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\SystemSettings\AccountNotifications', value: 'EnableAccountNotifications', type: REG_DWORD, data: '0', option: "fs-privacy"}

  - !powerShell:
      option: "fs-privacy"
      wait: true
      errorAction: Ignore
      command: |
        $caps = @('activity','appDiagnostics','appointments','backgroundSpatialPerception','bluetooth','bluetoothSync','cellularData','chat','contacts','email','eyeTracker','gazeInput','generativeAI','humanInterfaceDevice','humanPresence','location','passkeys','phoneCall','phoneCallHistory','radios','sensors','spatialPerception','userAccountInformation','userDataTasks','userNotificationListener')
        $recallCaps = @('activity','appDiagnostics','appointments','backgroundSpatialPerception','chat','contacts','email','eyeTracker','gazeInput','generativeAI','humanInterfaceDevice','humanPresence','passkeys','phoneCall','phoneCallHistory','radios','sensors','spatialPerception','userAccountInformation','userDataTasks','userNotificationListener')
        foreach ($scope in @('HKLM:\\SOFTWARE','Registry::HKEY_USERS\\.DEFAULT\\Software')) {
          foreach ($cap in $caps) {
            $val = 'Deny'
            if ($recallCaps -contains $cap) { $val = 'Allow' }
            $base = $scope + '\\Microsoft\\Windows\\CurrentVersion\\CapabilityAccessManager\\ConsentStore\\' + $cap
            try { New-Item -Path $base -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
            try { Set-ItemProperty -Path $base -Name 'Value' -Value $val -Type String -Force -ErrorAction SilentlyContinue } catch {}
            $np = $base + '\\NonPackaged'
            try { New-Item -Path $np -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
            try { Set-ItemProperty -Path $np -Name 'Value' -Value $val -Type String -Force -ErrorAction SilentlyContinue } catch {}
          }
        }
        Get-ChildItem -Path 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } | ForEach-Object {
          $sid = $_.PSChildName
          foreach ($cap in $caps) {
            $val = 'Deny'
            if ($recallCaps -contains $cap) { $val = 'Allow' }
            $base = 'Registry::HKEY_USERS\\' + $sid + '\\Software\\Microsoft\\Windows\\CurrentVersion\\CapabilityAccessManager\\ConsentStore\\' + $cap
            try { New-Item -Path $base -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
            try { Set-ItemProperty -Path $base -Name 'Value' -Value $val -Type String -Force -ErrorAction SilentlyContinue } catch {}
            $np = $base + '\\NonPackaged'
            try { New-Item -Path $np -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
            try { Set-ItemProperty -Path $np -Name 'Value' -Value $val -Type String -Force -ErrorAction SilentlyContinue } catch {}
          }
        }
        $vaScopes = @('Registry::HKEY_USERS\\.DEFAULT')
        Get-ChildItem -Path 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } | ForEach-Object { $vaScopes += ('Registry::HKEY_USERS\\' + $_.PSChildName) }
        foreach ($vs in $vaScopes) {
          $vaKey = $vs + '\\Software\\Microsoft\\Speech_OneCore\\Settings\\VoiceActivation'
          try { New-Item -Path $vaKey -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
          try { Set-ItemProperty -Path $vaKey -Name 'UserPreferenceForAllApps' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue } catch {}
        }
        $global:LASTEXITCODE = 0
  - !powerShell:
      option: "fs-privacy"
      wait: true
      errorAction: Ignore
      command: |
        $caps = @('appDiagnostics')
        $scopes = @('HKLM:\\SOFTWARE','Registry::HKEY_USERS\\.DEFAULT\\Software')
        foreach ($scope in $scopes) {
          foreach ($cap in $caps) {
            $base = $scope + '\\Microsoft\\Windows\\CurrentVersion\\CapabilityAccessManager\\ConsentStore\\' + $cap
            try { New-Item -Path $base -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
            try { Set-ItemProperty -Path $base -Name 'Value' -Value 'Allow' -Type String -Force -ErrorAction SilentlyContinue } catch {}
            try { Set-ItemProperty -Path $base -Name 'LastUsedTimeStop' -Value 0 -Type QWord -Force -ErrorAction SilentlyContinue } catch {}
            $np = $base + '\\NonPackaged'
            try { New-Item -Path $np -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
            try { Set-ItemProperty -Path $np -Name 'Value' -Value 'Allow' -Type String -Force -ErrorAction SilentlyContinue } catch {}
          }
        }
        foreach ($sidKey in (Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' })) {
          $sid = $sidKey.PSChildName
          foreach ($cap in $caps) {
            $base = 'Registry::HKEY_USERS\\' + $sid + '\\Software\\Microsoft\\Windows\\CurrentVersion\\CapabilityAccessManager\\ConsentStore\\' + $cap
            try { New-Item -Path $base -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
            try { Set-ItemProperty -Path $base -Name 'Value' -Value 'Allow' -Type String -Force -ErrorAction SilentlyContinue } catch {}
            $np = $base + '\\NonPackaged'
            try { New-Item -Path $np -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
            try { Set-ItemProperty -Path $np -Name 'Value' -Value 'Allow' -Type String -Force -ErrorAction SilentlyContinue } catch {}
          }
        }
        $global:LASTEXITCODE = 0
        exit 0


  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $ebosDir = Join-Path $env:windir 'EBOS'
      # ebos-options.txt is deliberately KEPT. It is what the verification pass
      # reads to know which gated actions were supposed to run, and it is only a
      # list of the options that were ticked.
      foreach ($f in @('ebos-pkgs-current.txt')) {
        $p = Join-Path $ebosDir $f
        if (Test-Path $p) { Remove-Item -Path $p -Force -ErrorAction SilentlyContinue }
      }
      $winreAgent = Join-Path $env:SystemDrive '$WinREAgent'
      if (Test-Path $winreAgent) {
        & cmd.exe /c rd /s /q "$winreAgent" 2>$null | Out-Null
      }
      $global:LASTEXITCODE = 0

  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $marker = Join-Path $env:windir 'EBOS\.personalization-applied'
      if (Test-Path $marker) { $global:LASTEXITCODE = 0; return }
      Get-Process -Name 'StartMenuExperienceHost' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      $profiles = @('C:\Users\Default')
      Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue | Where-Object {
        $_.Name -notin @('Default User','Public','All Users','Default','WDAGUtilityAccount')
      } | ForEach-Object { $profiles += $_.FullName }
      foreach ($profile in $profiles) {
        $shellDir = Join-Path $profile 'AppData\Local\Microsoft\Windows\Shell'
        if (Test-Path $shellDir) {
          Get-ChildItem -Path $shellDir -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        }
        $smehBase = Join-Path $profile 'AppData\Local\Packages\Microsoft.Windows.StartMenuExperienceHost_cw5n1h2txyewy'
        foreach ($sub in @('LocalState','TempState','LocalCache')) {
          $d = Join-Path $smehBase $sub
          if (Test-Path $d) {
            Get-ChildItem -Path $d -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
        }
        $iconCache = Join-Path $profile 'AppData\Local\Microsoft\Windows\Caches'
        if (Test-Path $iconCache) {
          Get-ChildItem -Path $iconCache -Force -ErrorAction SilentlyContinue -Filter '*.db' | Remove-Item -Force -ErrorAction SilentlyContinue
        }
      }
      $global:LASTEXITCODE = 0

  - !powerShell:
      wait: true
      errorAction: Ignore
      command: |
        $startupDirs = New-Object System.Collections.Generic.List[string]
        $startupDirs.Add((Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Startup'))
        $startupDirs.Add((Join-Path $env:SystemDrive 'Users\Default\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'))
        $profileList = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList'
        Get-ChildItem $profileList -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-' } | ForEach-Object {
          $pp = (Get-ItemProperty -Path $_.PSPath -Name 'ProfileImagePath' -ErrorAction SilentlyContinue).ProfileImagePath
          if ($pp -and (Test-Path $pp)) {
            $startupDirs.Add((Join-Path $pp 'AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'))
          }
        }
        foreach ($d in $startupDirs) {
          if (-not (Test-Path $d)) {
            New-Item -ItemType Directory -Path $d -Force -ErrorAction SilentlyContinue | Out-Null
          }
        }
        $global:LASTEXITCODE = 0

  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $ebosDir = Join-Path $env:windir 'EBOS'
      New-Item -ItemType Directory -Path $ebosDir -Force -ErrorAction SilentlyContinue | Out-Null
      $marker = Join-Path $ebosDir '.personalization-applied'
      if (-not (Test-Path $marker)) {
        Set-Content -Path $marker -Value '1' -Force -Encoding ASCII -ErrorAction SilentlyContinue
      }
      $global:LASTEXITCODE = 0

  - !powerShell:
    wait: true
    errorAction: Ignore
    command: |
      $rep = Join-Path (Join-Path $env:windir 'EBOS') 'ebos-taskbar-enforce.txt'
      try {
        $stamp = (Get-Date -Format 'yyyyMMddHHmmss')
        $key = [Microsoft.Win32.Registry]::LocalMachine.CreateSubKey('SOFTWARE\EBOS\EBOS')
        if ($null -eq $key) { throw 'CreateSubKey returned null' }
        $sha = [System.Security.Cryptography.SHA256]::Create()
        $hash = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes('EBOS-' + $stamp + '-R11.2'))
        $sha.Dispose()
        $hex = -join ($hash | ForEach-Object { $_.ToString('x2') })
        $key.SetValue('Installed', 1, [Microsoft.Win32.RegistryValueKind]::DWord)
        $key.SetValue('Version', 'R11.2', [Microsoft.Win32.RegistryValueKind]::String)
        $key.SetValue('Edition', 'EarlyAccess', [Microsoft.Win32.RegistryValueKind]::String)
        $key.SetValue('AppliedAt', $stamp, [Microsoft.Win32.RegistryValueKind]::String)
        $key.SetValue('Signature', $hex, [Microsoft.Win32.RegistryValueKind]::String)
        $key.Close()
        $chk = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\EBOS\EBOS')
        if ($null -eq $chk) {
          Add-Content -Path $rep -Value 'stamp FAILED: key absent immediately after write' -ErrorAction SilentlyContinue
        } else {
          $sigLen = ([string]$chk.GetValue('Signature')).Length
          Add-Content -Path $rep -Value ('stamp ok: Installed=' + $chk.GetValue('Installed') + ' Version=' + $chk.GetValue('Version') + ' AppliedAt=' + $chk.GetValue('AppliedAt') + ' SignatureLen=' + $sigLen) -ErrorAction SilentlyContinue
          $chk.Close()
        }
      } catch {
        Add-Content -Path $rep -Value ('stamp FAILED: ' + $_.Exception.GetType().Name + ': ' + $_.Exception.Message) -ErrorAction SilentlyContinue
      }
      $global:LASTEXITCODE = 0
  - !powerShell:
      wait: true
      exeDir: true
      errorAction: Ignore
      command: >-
        .\crossdevice-neuter.ps1
  - !writeStatus: {status: "Installing Windhawk (no mods)"}
  - !powerShell:
      wait: true
      exeDir: true
      errorAction: Ignore
      command: >-
        .\install-windhawk.ps1

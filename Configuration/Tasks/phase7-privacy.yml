  - !registryValue: {path: 'HKLM\Software\Microsoft\SQMClient\Windows', value: 'CEIPEnable', type: REG_DWORD, data: '0', option: "fs-privacy"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OOBE', value: 'DisableVoice', type: REG_DWORD, data: '1', option: "fs-privacy"}

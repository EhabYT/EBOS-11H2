          & reg.exe unload ('HKU\' + $key) 2>&1 | Out-Null
        } else {
        }
      }
      $ntuDefault = 'C:\Users\Default\NTUSER.DAT'
      if (Test-Path $ntuDefault) {
        $loadResult = & reg.exe load 'HKU\EBOS_P_Default' $ntuDefault 2>&1
        if ($LASTEXITCODE -eq 0) {
          try { Apply-ToHive 'Registry::HKEY_USERS\EBOS_P_Default' 'Default' } catch {}
          [gc]::Collect(); Start-Sleep -Milliseconds 300
          & reg.exe unload 'HKU\EBOS_P_Default' 2>&1 | Out-Null
        }
      }
      $global:LASTEXITCODE = 0

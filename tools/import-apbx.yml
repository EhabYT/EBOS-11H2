# APBX import workflow
#
# PARKED IN tools/ ON PURPOSE: the GitHub App connection used to edit this repo
# has no `workflows` permission, so it cannot create files under
# .github/workflows/. Move it into place from a machine with push access:
#
#   mkdir -p .github/workflows
#   git mv tools/import-apbx.yml .github/workflows/import-apbx.yml
#   git commit -m "Enable APBX import workflow" && git push
#
# Then: Actions tab -> "Import APBX" -> Run workflow.
#
# WHY THIS EXISTS: the sandbox this repo is edited from can only reach
# github.com / api.github.com / codeload.github.com. Release assets are served
# from release-assets.githubusercontent.com, which is blocked there, so the
# bytes have to be unpacked by a runner and committed back.
#
# The password can come from a repository secret APBX_PASS (preferred) or from
# the `password` dispatch input. Inputs are visible in the run UI on public
# repos, so add the secret in Settings -> Secrets and variables -> Actions if
# you don't want the password shown there.

name: Import APBX

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset id to import'
        required: false
        default: '647664817'
      password:
        description: 'Archive password (leave blank to use the APBX_PASS secret)'
        required: false
        default: ''
      dest:
        description: 'Destination folder inside the repo (blank = repo root)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apbx
          gh api "repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -H "Accept: application/octet-stream" > /tmp/apbx/playbook.apbx
          echo "downloaded bytes: $(stat -c%s /tmp/apbx/playbook.apbx)"
          file /tmp/apbx/playbook.apbx || true
          sha256sum /tmp/apbx/playbook.apbx

      - name: Extract
        env:
          APBX_PASS: ${{ inputs.password != '' && inputs.password || secrets.APBX_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${APBX_PASS:-}" ]; then
            echo "No password supplied (neither input nor APBX_PASS secret)." >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unzip
          mkdir -p /tmp/apbx/out
          cd /tmp/apbx
          if 7z x -y -p"$APBX_PASS" -o/tmp/apbx/out playbook.apbx >/tmp/apbx/7z.log 2>&1; then
            echo "method=7z"   >> "$GITHUB_STEP_SUMMARY"
            echo "extracted with 7z"
          elif unzip -o -P "$APBX_PASS" playbook.apbx -d /tmp/apbx/out >/tmp/apbx/unzip.log 2>&1; then
            echo "method=unzip" >> "$GITHUB_STEP_SUMMARY"
            echo "extracted with unzip"
          else
            echo "extraction failed with both 7z and unzip" >&2
            tail -20 /tmp/apbx/7z.log    || true
            tail -20 /tmp/apbx/unzip.log || true
            exit 1
          fi
          echo "files extracted: $(find /tmp/apbx/out -type f | wc -l)"
          echo "total bytes:     $(du -sb /tmp/apbx/out | cut -f1)"
          find /tmp/apbx/out -maxdepth 2 | head -60

      - name: Stage into repo
        run: |
          set -euo pipefail
          chmod +x .github/scripts/stage_apbx.py
          python3 .github/scripts/stage_apbx.py \
            --src /tmp/apbx/out \
            --repo "$GITHUB_WORKSPACE" \
            --dest "${{ inputs.dest }}" \
            --max-bytes 90000000 \
            --report IMPORT-REPORT.md

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Import playbook from release asset ${{ inputs.asset_id }}"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "pushed to ${{ github.ref_name }}"
          fi
